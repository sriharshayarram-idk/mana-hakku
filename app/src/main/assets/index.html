<style>
/* Layout: single mobile-first column, sticky tab bar, cards only for results; indigo ink + turmeric accent on cool paper */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E8EAE4; --ink:#1B2233; --muted:#596173; --line:#D6D9D2;
  --indigo:#2B3A8F; --indigo-soft:#E4E7F6; --ochre:#B97A0C; --ochre-soft:#F7ECD3;
  --crit:#B4232C; --crit-soft:#F8E1E2; --warn:#9A5B00; --warn-soft:#F6E9D2; --ok:#2E7D4F; --ok-soft:#DDEFE4;
  --f-display:"Anek Telugu","Hind Guntur",system-ui,sans-serif;
  --f-body:"Hind Guntur","Anek Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#191E29; --sunk:#202634; --ink:#E8EAF0; --muted:#9AA2B4; --line:#2C3342;
  --indigo:#9AA7F2; --indigo-soft:#252C4A; --ochre:#E3A93A; --ochre-soft:#3A2F17;
  --crit:#F08A8F; --crit-soft:#3D2023; --warn:#F0B254; --warn-soft:#3A2D16; --ok:#76CF9A; --ok-soft:#1C3527; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#191E29; --sunk:#202634; --ink:#E8EAF0; --muted:#9AA2B4; --line:#2C3342;
  --indigo:#9AA7F2; --indigo-soft:#252C4A; --ochre:#E3A93A; --ochre-soft:#3A2F17;
  --crit:#F08A8F; --crit-soft:#3D2023; --warn:#F0B254; --warn-soft:#3A2D16; --ok:#76CF9A; --ok-soft:#1C3527; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:16px 10px;display:flex;flex-direction:column;gap:4px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.8rem;line-height:1.1;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .alt{font-size:1rem;font-weight:600;color:var(--ochre)}
.sub{color:var(--muted);font-size:.95rem;margin:0;max-width:62ch}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.langs button{font:inherit;font-weight:600;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--indigo);color:var(--surface)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;flex-wrap:wrap;gap:4px;padding-block:6px}
.tab{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:9px 12px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--indigo-soft);color:var(--indigo)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;line-height:1.25;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0;line-height:1.3}
p{margin:0}
.lede{color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.intro{display:flex;flex-direction:column;gap:8px}
.introhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
form,.stack{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:.95rem;min-width:0}
label .hint{font-weight:400;color:var(--muted);font-size:.83rem}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
legend{font-weight:500;font-size:.95rem;padding:0;margin-bottom:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:500;cursor:pointer}
.seg input{width:auto;accent-color:var(--indigo)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--indigo);background:var(--indigo);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--indigo)}
.btn.quiet{border-color:var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.55;cursor:default}
.listen{font:inherit;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ochre);background:var(--ochre-soft);color:var(--ochre);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.listen svg{width:16px;height:16px;fill:currentColor}
.listen[aria-pressed="true"]{background:var(--ochre);color:var(--surface)}
.note{font-size:.86rem;color:var(--muted)}
.example-flag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;background:var(--ochre-soft);color:var(--ochre);border-radius:999px;padding:2px 10px;font-weight:600;align-self:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.result-head{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--ink)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ind{background:var(--indigo-soft);color:var(--indigo)}
.rep .chip.ind{display:inline;border:0;padding:2px 10px;border-radius:999px;font-size:.82rem;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.block{display:flex;flex-direction:column;gap:6px;min-width:0}
.block ul,.block ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.law{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.95rem}
.law b{font-family:var(--f-mono);font-weight:500;font-size:.8rem;color:var(--indigo);white-space:nowrap;padding-top:3px}
.phase{display:grid;grid-template-columns:84px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0;padding-top:0}
.phase .when{font-family:var(--f-body);font-size:.85rem;color:var(--ochre);font-weight:600;padding-top:2px}
.phase ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ladder li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:.95rem}
.ladder li:first-child{border-top:0}
.ladder .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:3px}
.ladder .tel{font-family:var(--f-mono);font-size:.88rem;color:var(--indigo);user-select:all}
.ai-box{border-left:3px solid var(--ochre);padding-left:12px;display:flex;flex-direction:column;gap:8px}
.ai-out{font-size:.95rem;display:flex;flex-direction:column;gap:8px}
.ai-out table{border-collapse:collapse;width:100%;font-size:.88rem}
.ai-out th,.ai-out td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.indic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.indic{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ind{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ind .v{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.05;font-variant-numeric:tabular-nums}
.ind .l{font-size:.86rem;line-height:1.35}
.ind .s{font-size:.75rem;color:var(--muted)}
.ind.flag .v{color:var(--crit)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,170px) 1fr 34px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--indigo);border-radius:6px}
.bar .fill.hi{background:var(--crit)}
.bar .num{font-family:var(--f-mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters select{width:auto;flex:1 1 160px}
.reports{display:flex;flex-direction:column;gap:10px}
.rep{-webkit-user-select:none;user-select:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rep.u-high{border-left-color:var(--crit)}
.rep.u-medium{border-left-color:var(--warn)}
.rep.u-low{border-left-color:var(--ok)}
.rep .meta{font-size:.82rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.rep .desc{font-size:.95rem;overflow-wrap:anywhere}
.rep .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rep select{width:auto;padding:4px 8px;font-size:.85rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--muted)}
.empty b{color:var(--ink)}
table.dist{border-collapse:collapse;width:100%;font-size:.9rem}
table.dist th,table.dist td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.dist td.n,table.dist th.n{text-align:right}
table.dist td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.dist th{font-weight:600;font-size:.82rem;color:var(--muted)}
.sources{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.src{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src a{color:var(--indigo);font-weight:600;text-decoration:none}
.src a:hover{text-decoration:underline}
.src .k{font-size:.78rem;color:var(--muted)}
.src label{flex-direction:row;align-items:center;gap:6px;font-size:.86rem;font-weight:500}
.src input{width:auto;accent-color:var(--ok)}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meter{display:flex;gap:3px}
.meter i{width:22px;height:8px;border-radius:3px;background:var(--sunk);display:block}
.meter i.on{background:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
footer .wrap{padding-block:0 32px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.getapp{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-weight:600;font-size:.9rem;color:var(--indigo);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.getapp svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.labelrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mic{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo)}
.mic[aria-busy="true"]{background:var(--indigo);color:var(--surface)}
@media (prefers-reduced-motion:no-preference){.card,.rep{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
/* Report v2: one plain question per section */
.result{display:flex;flex-direction:column;gap:14px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{background:#26337F;color:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h2{color:#fff;font-size:1.5rem}
.herotop{display:flex;gap:14px;align-items:center}
.heroicon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.heroicon .ico{width:32px;height:32px;stroke-width:1.7}
.herotext{min-width:0}
.summary{font-size:1.05rem;line-height:1.5}
.hero .chip{background:rgba(255,255,255,.16);color:#fff}
.hero .chip.crit{background:#FFE1E3;color:#9B1C24}
.hero .chip.warn{background:#FCEBCB;color:#7A4800}
.hero .chip.ok{background:#D7F0E0;color:#22603D}
.listen.big{align-self:flex-start;font-size:1rem;padding:10px 18px;background:#fff;color:#26337F;border-color:#fff}
.listen.big[aria-pressed="true"]{background:#E3A93A;color:#1B2233;border-color:#E3A93A}
.listen.big svg{width:20px;height:20px}
.urgent{background:var(--crit-soft);border:2px solid var(--crit);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.urgent h3{color:var(--crit)}
.urgent .qi{background:var(--crit);color:var(--surface)}
.urgent .call{border-color:var(--crit)}
.urgent .call .num{color:var(--crit)}
.first{background:var(--ochre-soft);border:2px solid var(--ochre);border-radius:14px;padding:14px 16px}
.first .qi{background:var(--ochre);color:var(--surface)}
.first .eyebrow{color:var(--ochre);font-weight:600}
.firsttext{font-size:1.1rem;font-weight:600;line-height:1.45;color:var(--ink)}
.q{display:flex;align-items:flex-start;gap:12px}
.qi{width:40px;height:40px;border-radius:12px;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;flex:none}
.qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qt h3{font-size:1.12rem}
.mini{width:40px;height:40px;border-radius:50%;border:1px solid var(--ochre);background:var(--ochre-soft);color:var(--ochre);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.mini svg{width:20px;height:20px;fill:currentColor}
.mini[aria-pressed="true"]{background:var(--ochre);color:var(--surface)}
.gov{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.gov{grid-template-columns:1fr}}
.g{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.glbl{font-size:.8rem;font-weight:700;color:var(--indigo);text-transform:uppercase;letter-spacing:.04em}
.g ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.rights{display:flex;flex-direction:column;gap:10px}
.art{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.badge{font-weight:700;font-size:.8rem;background:var(--indigo);color:var(--surface);border-radius:6px;padding:3px 8px;white-space:nowrap;margin-top:2px}
.hr{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.hr b{color:var(--ink);font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl>li{position:relative;padding:0 0 18px 32px}
.tl>li::before{content:"";position:absolute;left:6px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 4px var(--ochre-soft)}
.tl>li::after{content:"";position:absolute;left:12px;top:24px;bottom:2px;width:2px;background:var(--line)}
.tl>li:last-child{padding-bottom:0}
.tl>li:last-child::after{display:none}
.tl .when{font-weight:700;color:var(--ochre);display:block;margin-bottom:4px}
.tl ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.chip.scheme{background:var(--indigo-soft);color:var(--indigo);font-size:.88rem;padding:4px 12px}
.stairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stairs li{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.stairs li:first-child{border-top:0;padding-top:0}
.stairs .n{width:32px;height:32px;border-radius:50%;background:var(--sunk);font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.stairs li:first-child .n{background:var(--ochre);color:var(--surface)}
.stairs p{margin:2px 0 0;font-size:.93rem;color:var(--muted)}
.start{font-size:.75rem;font-weight:700;color:var(--ochre);background:var(--ochre-soft);border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.tel{color:var(--indigo);font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.calls{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.call{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.call .num{font-family:var(--f-display);font-weight:700;font-size:1.35rem;color:var(--indigo);font-variant-numeric:tabular-nums;line-height:1.2}
.call .lbl{font-size:.83rem;color:var(--muted);line-height:1.3}
.terms{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.93rem}
.terms dt{font-weight:700;color:var(--indigo);white-space:nowrap}
.terms dd{margin:0}
@media (max-width:420px){.terms{grid-template-columns:1fr}.terms dd{margin-bottom:6px}}
.actions{gap:10px}
.verhelp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
.verhelp summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:600}
.verhelp summary::-webkit-details-marker{display:none}
.verhelp summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--muted)}
.verhelp[open] summary::after{content:"−"}
.verhelp summary .qi{width:28px;height:28px;border-radius:50%;font-family:Georgia,serif;font-style:italic;font-weight:700}
#ver-help-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.vhow{display:flex;gap:10px;align-items:flex-start}
.vhow p{flex:1;font-size:.93rem;color:var(--muted)}
.vrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.vrow.cur{border:2px solid var(--indigo);background:var(--indigo-soft)}
.vrow .vtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vrow .here{font-size:.75rem;font-weight:700;color:var(--indigo)}
.vrow .vdo{font-size:.9rem;font-weight:600}
#n-verdict{cursor:pointer}
.manual{background:var(--ochre-soft);border-left:4px solid var(--ochre);border-radius:8px;padding:10px 12px;font-size:.92rem;color:var(--ink)}
.src label{max-width:52%;text-align:right;line-height:1.3;justify-content:flex-end}
.ind{font:inherit;text-align:left;cursor:pointer;color:var(--ink);position:relative}
.ind .chev{position:absolute;top:10px;right:10px;font-size:.7rem;color:var(--muted)}
.ind.open{border:2px solid var(--indigo);background:var(--indigo-soft)}
#indic-detail{background:var(--surface);border:2px solid var(--indigo);border-radius:12px;padding:16px}
.idet{display:flex;flex-direction:column;gap:12px}
.idet .glbl{margin-bottom:2px}
.cbar{display:grid;grid-template-columns:minmax(0,110px) 1fr 56px;gap:10px;align-items:center;font-size:.9rem}
.ct{position:relative;height:14px;background:var(--sunk);border-radius:7px}
.cf{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.cf.ap{background:var(--indigo)}.cf.in{background:var(--muted)}
.cw{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit)}
.cwkey{display:inline-block;width:2px;height:12px;background:var(--crit);vertical-align:middle}
.cv{font-family:var(--f-mono);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.good{color:var(--ok)}.bad{color:var(--crit)}
.export{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.pii{background:var(--crit-soft);border:2px solid var(--crit);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pii .piit{font-weight:700;color:var(--crit)}
.pii ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.93rem}
.suggest .card textarea{min-height:90px}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subnav button{flex:0 0 auto;font:inherit;font-size:.86rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--indigo);border-radius:999px;padding:6px 12px;cursor:pointer}
.sech{font-size:1.2rem;padding-top:6px;border-top:1px solid var(--line)}
#rk-search,#hi-search{font-size:16px}
.rlist{display:flex;flex-direction:column;gap:12px}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.rrow .badge{min-width:76px;text-align:center}
.badge.law{min-width:0;background:var(--ochre);color:var(--surface)}
.rtx{min-width:0;display:flex;flex-direction:column;gap:2px}
.rtx p{margin:0}
.gnum{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.arow:first-child{border-top:0}
.anum{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.arow.key .anum{background:var(--indigo);color:var(--surface)}
.ah{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.decade,.dist{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.decade summary,.dist summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;align-items:center;gap:10px}
.decade summary::-webkit-details-marker,.dist summary::-webkit-details-marker{display:none}
.decade summary::after,.dist summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--muted)}
.decade[open] summary::after,.dist[open] summary::after{content:"−"}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.dn{display:flex;flex-direction:column;min-width:0}
.dfacts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dfacts dt{font-weight:700;color:var(--indigo)}
.dfacts dd{margin:0}
@media (max-width:480px){.dfacts{grid-template-columns:1fr}.dfacts dd{margin-bottom:6px}}
.duties{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.pre{grid-template-columns:1fr}}
.pre blockquote{margin:0;padding:12px 14px;background:var(--bg);border-left:4px solid var(--ochre);border-radius:8px;line-height:1.7}
.coi{display:flex;flex-wrap:wrap;gap:10px}
.coi a{text-decoration:none}
.htl .era{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:2px}
.htl p{margin:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ptop{display:flex;gap:10px;align-items:center}
.ptop .qt{gap:0}
.pav{width:40px;height:40px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;flex:none}
.keyam{border:2px solid var(--indigo)}
.stbtn{font:inherit;font-size:.82rem;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--indigo);border-radius:999px;padding:5px 12px;cursor:pointer}
.stbtn .chg{color:var(--muted);font-weight:500}.stbtn .chg::before{content:"⇄ ";}
.stpick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stcard{font:inherit;text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;gap:4px;color:var(--ink);min-width:0}
.stcard:hover,.stcard:focus-visible{border-color:var(--indigo)}
.stcard.last{border-color:var(--indigo);background:var(--indigo-soft)}
.stcard .stte{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.15;color:var(--indigo)}
.stcard .sten{font-weight:600;font-size:1.05rem}
.stcard .stn{font-size:.86rem;color:var(--muted)}
.stcard .go{margin-top:10px;font-weight:600;color:var(--indigo);font-size:.92rem}
@media (max-width:520px){.stpick{grid-template-columns:1fr}}
dialog.pop{border:0;border-radius:16px;padding:0;width:calc(100% - 24px);max-width:580px;max-height:88vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,15,30,.35)}
dialog.pop::backdrop{background:rgba(10,15,30,.55)}
dialog.pop[open]{display:flex;flex-direction:column}
.pophead{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.pophead h3{flex:1;margin:0;font-family:var(--f-display);font-size:1.2rem;line-height:1.3}
.popx{font:inherit;font-size:1.2rem;line-height:1;border:0;background:var(--sunk);color:var(--ink);border-radius:999px;width:34px;height:34px;cursor:pointer;flex:none}
.popbody{padding:12px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.popfoot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.nitem{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px dashed var(--line)}
.nitem:first-of-type{border-top:0}
.nlink{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer;background:var(--surface)}
.nlink:first-of-type{border-top:1px solid var(--line)}
.nlink:hover,.nlink:focus-visible{border-color:var(--indigo);background:var(--indigo-soft)}
.nlink .nt{color:var(--indigo);font-weight:600;overflow-wrap:anywhere}
.nwarn{border:1px dashed var(--crit);border-radius:12px;padding:12px 14px;margin-top:8px;background:var(--crit-soft)}
.nwarn .nt{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.warnline{font-size:.86rem;font-weight:600;color:var(--crit);margin-top:4px}
.readat{font-weight:600;font-size:.88rem;color:var(--indigo);margin-top:4px}
.nmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.autosrc{border:2px solid var(--indigo);background:var(--indigo-soft);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.autosrc.none{border-color:var(--line);background:var(--surface)}
.autosrc p{margin:0;flex:1 1 200px;font-weight:600}
.autosrc.none p{font-weight:500;color:var(--muted)}
.pdfov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.pdfov[hidden]{display:none}
.pdfbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--indigo);color:#fff}
.pdfbar b{flex:1;font-family:var(--f-display);font-size:1.05rem;line-height:1.25;min-width:0}
.pdfbar button{font:inherit;font-weight:600;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.pdfov iframe{flex:1;width:100%;border:0;background:#fff}
.coibooks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.coibook{font:inherit;text-align:left;cursor:pointer;border:2px solid var(--indigo);background:var(--indigo-soft);color:var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.coibook .bt{font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:var(--indigo)}
.coibook .bs{font-size:.85rem;color:var(--muted)}
.coibook .bo{margin-top:6px;font-weight:600;color:var(--indigo)}
@media (max-width:520px){.coibooks{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="toprow">
    <p class="eyebrow" id="home-eb" data-t="homeEb" hidden></p><button type="button" class="stbtn" id="st-btn" hidden><span id="st-name"></span><span class="chg" data-t="changeState"></span></button>
    <div class="langs" role="group" aria-label="Language / భాష">
      <button type="button" id="lang-te" aria-pressed="true" lang="te">తెలుగు</button>
      <button type="button" id="lang-en" aria-pressed="false" lang="en">English</button>
    </div>
  </div>
  <h1 class="brand"><span id="brand-main">మన హక్కు</span><span class="alt" id="brand-alt">Mana Hakku</span></h1>
  <p class="sub" data-t="tagline">Every need, the right department, the right law.</p>
</div></header>

<nav class="tabs" id="tabs" aria-label="Sections"><div class="wrap" role="tablist">
  <button class="tab" role="tab" id="t-report" aria-selected="true" data-view="report" data-t="tabReport">Report a need</button>
  <button class="tab" role="tab" id="t-dash" aria-selected="false" data-view="dash" data-t="tabDash">Gap dashboard</button>
  <button class="tab" role="tab" id="t-all" aria-selected="false" data-view="all" data-t="tabAll">All issues</button>
  <button class="tab" role="tab" id="t-news" aria-selected="false" data-view="news" data-t="tabNews">News check</button>
  <button class="tab" role="tab" id="t-rights" aria-selected="false" data-view="rights" data-t="tabRights">Right knowledge</button>
  <button class="tab" role="tab" id="t-history" aria-selected="false" data-view="history" data-t="tabHistory">History</button>
</div></nav>

<main>
<section class="wrap" id="v-home" hidden>
  <div class="intro">
    <div class="introhead"><h2 data-t="homeH"></h2><button class="listen" type="button" data-speak="home"></button></div>
    <p class="lede" data-t="homeLede"></p>
  </div>
  <div class="stpick">
    <button type="button" class="stcard" data-state="ap"><span class="stte">ఆంధ్రప్రదేశ్</span><span class="sten">Andhra Pradesh</span><span class="stn" data-t="apCount"></span><span class="go" data-t="openState"></span></button>
    <button type="button" class="stcard" data-state="ts"><span class="stte">తెలంగాణ</span><span class="sten">Telangana</span><span class="stn" data-t="tsCount"></span><span class="go" data-t="openState"></span></button>
  </div>
  <p class="note" data-t="homeNote"></p>
</section>
<section class="wrap" id="v-report" aria-labelledby="t-report">
  <div class="intro">
    <div class="introhead"><h2 data-t="repH">What is missing in your area?</h2><button class="listen" type="button" data-speak="report"></button></div>
    <p class="lede" data-t="repLede"></p>
  </div>
  <form id="f-report" class="card" autocomplete="off">
    <span class="example-flag" id="ex-flag" data-t="exFlag"></span>
    <div class="row">
      <label for="r-district"><span data-t="district"></span><select id="r-district" required></select></label>
      <label for="r-place"><span data-t="place"></span><input id="r-place" maxlength="80"></label>
    </div>
    <div class="labelrow"><label for="r-desc" style="flex:1 1 200px"><span data-t="desc"></span> <span class="hint" data-t="descHint"></span></label><button class="listen mic" type="button" id="r-mic" data-mic="r-desc" hidden></button></div>
    <textarea id="r-desc" required maxlength="1500" aria-label="Describe the need"></textarea>
    <div class="pii" id="pii-warn" role="alert" hidden><p class="piit" id="pii-title"></p><ul id="pii-list"></ul><div class="btns"><button class="btn quiet" type="button" id="pii-fix"></button></div></div>
    <div class="row">
      <label for="r-sector"><span data-t="sector"></span><select id="r-sector"></select></label>
      <label for="r-affected"><span data-t="affected"></span><input id="r-affected" type="number" min="1" max="10000000" inputmode="numeric"></label>
    </div>
    <fieldset>
      <legend data-t="urgency"></legend>
      <div class="seg">
        <label><input type="radio" name="urg" id="u-high" value="high"> <span data-t="uHigh"></span></label>
        <label><input type="radio" name="urg" id="u-medium" value="medium" checked> <span data-t="uMed"></span></label>
        <label><input type="radio" name="urg" id="u-low" value="low"> <span data-t="uLow"></span></label>
      </div>
    </fieldset>
    <p class="manual" id="reg-note" data-t="registerNote" hidden></p>
    <div class="btns">
      <button class="btn" type="submit" data-t="analyse"></button>
      <button class="btn quiet" type="button" id="r-clear" data-t="clear"></button>
    </div>
  </form>
  <div id="r-result"></div>
</section>

<section class="wrap" id="v-dash" aria-labelledby="t-dash" hidden>
  <div class="intro">
    <div class="introhead"><h2 data-t="dashH"></h2><button class="listen" type="button" data-speak="dash"></button></div>
    <p class="lede" data-t="dashLede"></p>
  </div>
  <div class="stack">
    <p class="eyebrow" data-t="indicEb"></p>
    <div class="indic" id="indic"></div>
    <div id="indic-detail" hidden></div>
    <p class="note"><span data-t="tapIndic"></span> <span data-t="indicNote"></span></p>
  </div>
  <div class="card">
    <div class="btns" style="justify-content:space-between">
      <h3 data-t="reportedH"></h3>
      <label style="flex-direction:row;align-items:center;gap:6px;font-weight:500;font-size:.86rem"><input type="checkbox" id="d-demo" style="width:auto"> <span data-t="showDemo"></span></label>
    </div>
    <div class="btns" style="justify-content:space-between"><p class="note" id="d-src"></p><button class="btn quiet" type="button" id="d-refresh" hidden></button></div>
    <div id="d-summary"></div>
    <p class="note" data-t="viewOnlyNote"></p>
  </div>
  <div class="stack">
    <div class="filters">
      <select id="d-f-district" aria-label="District"></select>
      <select id="d-f-sector" aria-label="Sector"></select>
      <select id="d-f-status" aria-label="Status"></select>
    </div>
    <div class="reports" id="d-list"></div>
  </div>
</section>

<section class="wrap" id="v-news" aria-labelledby="t-news" hidden>
  <div class="intro">
    <div class="introhead"><h2 data-t="newsH"></h2><button class="listen" type="button" data-speak="news"></button></div>
    <p class="lede" data-t="newsLede"></p>
  </div>
  <div class="card">
    <span class="example-flag" id="n-ex" data-t="nEx"></span>
    <div class="labelrow"><label for="n-text" style="flex:1 1 200px"><span data-t="nText"></span></label><button class="listen mic" type="button" id="n-mic" data-mic="n-text" hidden></button></div>
    <textarea id="n-text" maxlength="3000" aria-label="Headline or excerpt"></textarea>
    <div class="row">
      <label for="n-district"><span data-t="nDistrict"></span><select id="n-district"></select></label>
      <label for="n-query"><span data-t="nQuery"></span> <span class="hint" data-t="nQueryHint"></span><input id="n-query" maxlength="160"></label>
    </div>
    <div class="btns">
      <button class="btn" type="button" id="n-auto" data-t="autoFind"></button>
      <button class="btn" type="button" id="n-assess" data-t="assess"></button>
      <button class="btn ghost" type="button" id="n-tolog" data-t="toLog"></button>
    </div>
    <p class="note" id="n-note" data-t="nNote"></p>
    <div id="n-ai" hidden class="ai-box"></div>
  </div>
  <div class="stack">
    <div class="btns" style="justify-content:space-between">
      <h3 data-t="searchH"></h3>
      <div class="verdict"><div class="meter" id="n-meter"><i></i><i></i><i></i></div><span class="chip" id="n-verdict"></span></div>
    </div>
    <p class="manual" data-t="manualNote"></p>
    <div class="sources" id="n-sources"></div>
    <details class="verhelp" id="ver-help"><summary><span class="qi">i</span><span id="ver-help-q">What do these labels mean?</span></summary><div id="ver-help-body"></div></details>
    <p class="note" data-t="corrNote"></p>
  </div>
</section>
<section class="wrap" id="v-all" aria-labelledby="t-all" hidden>
  <div class="intro">
    <div class="introhead"><h2 data-t="allH"></h2><button class="listen" type="button" data-speak="all"></button></div>
    <p class="lede" data-t="allLede"></p>
  </div>
  <input id="a-search" type="search" autocomplete="off">
  <div class="filters">
    <select id="a-f-district" aria-label="District"></select>
    <select id="a-f-sector" aria-label="Sector"></select>
    <select id="a-f-status" aria-label="Status"></select>
    <select id="a-sort" aria-label="Order"></select>
  </div>
  <div class="btns" style="justify-content:space-between"><p class="note" id="a-count"></p><button class="btn quiet" type="button" id="a-refresh" hidden></button></div>
  <div class="reports" id="a-list"></div>
  <button class="btn ghost" type="button" id="a-more" hidden></button>
  <p class="note" data-t="viewOnlyNote"></p>
</section>
<section class="wrap" id="v-rights" aria-labelledby="t-rights" hidden>
  <div class="intro">
    <div class="introhead"><h2 data-t="rkH"></h2><button class="listen" type="button" data-speak="rights"></button></div>
    <p class="lede" data-t="rkLede"></p>
  </div>
  <input id="rk-search" type="search" autocomplete="off">
  <div class="subnav" role="navigation">
    <button type="button" data-jump="rk-fund" data-t="secFund"></button><button type="button" data-jump="rk-other" data-t="secOther"></button><button type="button" data-jump="rk-amend" data-t="secAmend"></button><button type="button" data-jump="rk-laws" data-t="secLaws"></button><button type="button" data-jump="rk-duties" data-t="secDuties"></button><button type="button" data-jump="rk-pre" data-t="secPre"></button><button type="button" data-jump="rk-coi" data-t="secCoi"></button>
  </div>
  <div class="stack" id="rk-fund"><h2 class="sech" data-t="secFund"></h2><p class="note" data-t="fundNote"></p><div class="stack" id="rk-fund-body"></div></div>
  <div class="stack" id="rk-other"><h2 class="sech" data-t="secOther"></h2><div class="card" id="rk-other-body"></div><p class="note" data-t="otherNote"></p></div>
  <div class="stack" id="rk-amend"><h2 class="sech" data-t="secAmend"></h2><p class="lede" data-t="amendLede"></p><div class="stack" id="rk-amend-body"></div></div>
  <div class="stack" id="rk-laws"><h2 class="sech" data-t="secLaws"></h2><div class="card" id="rk-laws-body"></div></div>
  <div class="stack" id="rk-duties"><h2 class="sech" data-t="secDuties"></h2><div class="card" id="rk-duties-body"></div></div>
  <div class="stack" id="rk-pre"><h2 class="sech" data-t="secPre"></h2><div class="card" id="rk-pre-body"></div><p class="note" data-t="preNote"></p></div>
  <div class="stack" id="rk-coi"><h2 class="sech" data-t="secCoi"></h2><div class="card" id="rk-coi-body"></div></div>
  <p class="note" id="rk-empty" hidden data-t="noResults"></p>
</section>

<section class="wrap" id="v-history" aria-labelledby="t-history" hidden>
  <div class="intro">
    <div class="introhead"><h2 data-t="hiH"></h2><button class="listen" type="button" data-speak="history"></button></div>

const SPK_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const STOP_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>';
const NATIVE=typeof window.AndroidTTS!=="undefined";
const WEBTTS="speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
const TTS=NATIVE||WEBTTS;
window.mhSpeechDone=()=>{if(speakingBtn){setListenBtn(speakingBtn,false);speakingBtn=null}};
let voices=[],speakingBtn=null;
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if(WEBTTS&&!NATIVE){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){}}
function pickVoice(lang){const p=lang.slice(0,2);return voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(p))||null}
const digits=s=>String(s).replace(/\d{3,}/g,m=>m.split("").join(" "));
function chunks(text){const parts=text.replace(/\s+/g," ").split(/(?<=[.!?।;:])\s+|\n/);const out=[];let cur="";for(const p of parts){if((cur+" "+p).length>220&&cur){out.push(cur);cur=p}else cur=cur?cur+" "+p:p}if(cur)out.push(cur);return out.filter(x=>x.trim())}
function stopSpeak(){if(!TTS)return;try{if(NATIVE)AndroidTTS.stop();else speechSynthesis.cancel()}catch(e){}if(speakingBtn){setListenBtn(speakingBtn,false)}speakingBtn=null}
function setListenBtn(b,on){b.setAttribute("aria-pressed",String(on));if(b.classList.contains("mini")){b.innerHTML=on?STOP_ICON:SPK_ICON;b.setAttribute("aria-label",on?t("stop"):t("listen"));return}const big=b.classList.contains("big");b.innerHTML=(on?STOP_ICON:SPK_ICON)+`<span>${esc(on?t("stop"):(big?R("listenAll"):t("listen")))}</span>`}
function speak(text,btn){
 if(!TTS){toast(t("noVoice"));return}
 if(speakingBtn===btn){stopSpeak();return}
 stopSpeak();
 if(NATIVE){const lang=LANG==="te"?"te-IN":"en-IN";
  try{if(LANG==="te"&&AndroidTTS.ready()&&!AndroidTTS.hasLang(lang)){const n=$("voice-note");n.textContent=t("noTeVoice");n.hidden=false;toast(t("noTeVoice"))}}catch(e){}
  speakingBtn=btn;setListenBtn(btn,true);try{AndroidTTS.speak(digits(text),lang)}catch(e){window.mhSpeechDone()}return}
 loadVoices();
 const lang=LANG==="te"?"te-IN":"en-IN";const v=pickVoice(lang);
 if(LANG==="te"&&!v){const n=$("voice-note");n.textContent=t("noTeVoice");n.hidden=false;toast(t("noTeVoice"))}
 const list=chunks(digits(text));if(!list.length)return;
 speakingBtn=btn;setListenBtn(btn,true);
 list.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.lang=lang;if(v)u.voice=v;u.rate=LANG==="te"?0.92:0.97;if(i===list.length-1){u.onend=()=>{if(speakingBtn===btn){setListenBtn(btn,false);speakingBtn=null}}}u.onerror=()=>{if(speakingBtn===btn){setListenBtn(btn,false);speakingBtn=null}};try{speechSynthesis.speak(u)}catch(e){}});
}
function bindListen(btn,getText){if(!TTS){btn.hidden=true;return}setListenBtn(btn,false);btn.onclick=()=>speak(getText(),btn)}

const TE_DIGITS="౦౧౨౩౪౫౬౭౮౯";
const normDigits=x=>x.replace(/[౦-౯]/g,c=>String(TE_DIGITS.indexOf(c)));
const RX_LONGNUM=/(?:\+?\d[\s.\-()]*){10,}/g;           // 10+ digits even with spaces or dashes
const RX_EMAIL=/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g;
const RX_PAN=/\b[A-Za-z]{5}\d{4}[A-Za-z]\b/g;
const NAME_CUES=[/\bmy name\b/i,/\bname\s*(is|:|-)/i,/\b[sdwc]\s*\/\s*o\b/i,/\b(son|daughter|wife|husband) of\b/i,/\b(?:[Mm]rs?|[Mm]s|[Ss]mt|[Dd]r)\.?\s+[A-Z][a-z]{2,}/,
 /నా పేరు/,/పేరు\s*[:\-]/,/తండ్రి పేరు/,/భర్త పేరు/,/తల్లి పేరు/,/శ్రీమతి\s+\S/,/కుమారుడు/,/కుమార్తె/];
function piiFound(text){
 const x=normDigits(String(text||""));const k=[];
 const longs=x.match(RX_LONGNUM)||[];
 longs.forEach(m=>{const d=m.replace(/\D/g,"");const phone=/^(?:91|0)?[6-9]\d{9}$/.test(d);const key=phone?"piiPhone":"piiLongNum";if(!k.includes(key))k.push(key)});
 if(RX_EMAIL.test(x))k.push("piiEmail");RX_EMAIL.lastIndex=0;
 if(RX_PAN.test(x))k.push("piiPan");RX_PAN.lastIndex=0;
 if(NAME_CUES.some(re=>re.test(x)))k.push("piiName");
 return k;
}
function piiStrip(text){return normDigits(text).replace(RX_LONGNUM," ").replace(RX_EMAIL," ").replace(RX_PAN," ").replace(/[ \t]{2,}/g," ").trim()}
function piiCheckForm(){
 const kinds=[...new Set([...piiFound($("r-desc").value),...piiFound($("r-place").value)])];
 const box=$("pii-warn");

 const fx=$("pii-fix");fx.textContent=t("piiFix");fx.hidden=kinds.every(k=>k==="piiName");
 box.hidden=false;return false;
}

 [["2nd century BCE – 3rd century CE","క్రీ.పూ. 2వ శతాబ్దం – క్రీ.శ. 3వ శతాబ్దం"],["Satavahanas","శాతవాహనులు"],["One of their earliest centres was Kotilingala in Karimnagar, where early Satavahana coins were found. Buddhist stupas rose at Dhulikatta and Phanigiri.","వారి తొలి కేంద్రాల్లో ఒకటి కరీంనగర్‌లోని కోటిలింగాల; అక్కడ తొలి శాతవాహన నాణేలు దొరికాయి. ధూళికట్ట, ఫణిగిరిలో బౌద్ధ స్తూపాలు వెలిశాయి."]],
 [["5th – 6th century","5వ – 6వ శతాబ్దం"],["Vishnukundins","విష్ణుకుండినులు"],["A dynasty that rose in Telangana, with Indrapalanagara (in today's Yadadri Bhuvanagiri) among its early seats; Keesaragutta is linked to them.","తెలంగాణలో పుట్టిన రాజవంశం; నేటి యాదాద్రి భువనగిరిలోని ఇంద్రపాలనగరం వారి తొలి కేంద్రాల్లో ఒకటి; కీసరగుట్ట వారితో ముడిపడి ఉంది."]],
 [["7th – 10th century","7వ – 10వ శతాబ్దం"],["Chalukyas, Rashtrakutas and the Vemulawada Chalukyas","చాళుక్యులు, రాష్ట్రకూటులు, వేములవాడ చాళుక్యులు"],["The Deccan passed between the Badami Chalukyas and the Rashtrakutas. Their feudatories, the Vemulawada Chalukyas, patronised poets; the Kurkyala inscription carries some of the earliest Telugu verse.","దక్కన్ బాదామి చాళుక్యులు, రాష్ట్రకూటుల మధ్య చేతులు మారింది. వారి సామంతులైన వేములవాడ చాళుక్యులు కవులను ఆదరించారు; కుర్క్యాల శాసనంలో తొలి తెలుగు పద్యాలు ఉన్నాయి."]],
 [["10th – 12th century","10వ – 12వ శతాబ్దం"],["Kalyani Chalukyas","కళ్యాణి చాళుక్యులు"],["The Western Chalukyas of Kalyani ruled the region; the Kakatiyas began as their governors around Hanumakonda.","కళ్యాణి పశ్చిమ చాళుక్యులు ఈ ప్రాంతాన్ని పాలించారు; కాకతీయులు హనుమకొండ చుట్టూ వారి సామంతులుగా ఎదిగారు."]],
 [["12th – 14th century","12వ – 14వ శతాబ్దం"],["Kakatiyas","కాకతీయులు"],["From Orugallu (Warangal) they united the Telugu lands. They built the Thousand Pillar Temple and the Ramappa Temple, now a UNESCO World Heritage Site, and great irrigation tanks like Pakhal, Ramappa and Laknavaram. Rudrama Devi ruled in her own right.","ఓరుగల్లు (వరంగల్) నుండి తెలుగు నేలను ఏకం చేశారు. వేయి స్తంభాల గుడి, నేడు యునెస్కో ప్రపంచ వారసత్వ ప్రదేశమైన రామప్ప దేవాలయం, పాకాల, రామప్ప, లక్నవరం వంటి గొప్ప చెరువులు నిర్మించారు. రుద్రమదేవి స్వయంగా పాలించారు."]],
 [["14th – 15th century","14వ – 15వ శతాబ్దం"],["Musunuri and Recherla Nayakas","ముసునూరి, రేచర్ల నాయకులు"],["After the fall of Warangal to the Delhi Sultanate, the Musunuri Nayaks freed the region. The Recherla Padma Nayakas then ruled from the hill forts of Rachakonda and Devarakonda.","వరంగల్ ఢిల్లీ సుల్తానుల వశమైన తర్వాత ముసునూరి నాయకులు ఈ ప్రాంతాన్ని విముక్తి చేశారు. తర్వాత రేచర్ల పద్మనాయకులు రాచకొండ, దేవరకొండ కొండకోటల నుండి పాలించారు."]],
 [["14th – 16th century","14వ – 16వ శతాబ్దం"],["Bahmani Sultanate","బహమనీ సుల్తానులు"],["The Bahmani Sultans of the Deccan took over Telangana; when their kingdom broke up, Golconda became the seat of a new dynasty.","దక్కన్ బహమనీ సుల్తానులు తెలంగాణను ఆక్రమించారు; వారి రాజ్యం చీలిపోయాక గోల్కొండ కొత్త రాజవంశానికి కేంద్రమైంది."]],
 [["16th – 17th century","16వ – 17వ శతాబ్దం"],["Qutb Shahis of Golconda","గోల్కొండ కుతుబ్‌షాహీలు"],["They founded the city of Hyderabad and built the Charminar. Golconda was famous for its diamonds. Ibrahim Qutb Shah patronised Telugu poets, and Bhakta Ramadasu built the Bhadrachalam temple in this period.","హైదరాబాద్ నగరాన్ని స్థాపించి చార్మినార్ నిర్మించారు. గోల్కొండ వజ్రాలకు ప్రసిద్ధి. ఇబ్రహీం కుతుబ్‌షా తెలుగు కవులను ఆదరించారు; ఈ కాలంలోనే భక్త రామదాసు భద్రాచలం ఆలయాన్ని నిర్మించారు."]],
 [["17th – 18th century","17వ – 18వ శతాబ్దం"],["Mughal rule","మొఘల్ పాలన"],["Aurangzeb conquered Golconda and the Deccan was governed by Mughal subahdars.","ఔరంగజేబు గోల్కొండను జయించాడు; దక్కన్‌ను మొఘల్ సుబేదార్లు పాలించారు."]],
 [["18th – 20th century","18వ – 20వ శతాబ్దం"],["Asaf Jahi Nizams","అసఫ్ జాహీ నిజాములు"],["The Nizams ruled Hyderabad State, the largest princely state in India, which was not part of British India. Salar Jung I modernised the administration, railways came, and Osmania University (1918) began teaching in Urdu.","భారతదేశంలో అతిపెద్ద సంస్థానమైన హైదరాబాద్ రాజ్యాన్ని నిజాములు పాలించారు; ఇది బ్రిటిష్ ఇండియాలో భాగం కాదు. సాలార్‌జంగ్ I పరిపాలనను ఆధునికీకరించారు, రైల్వేలు వచ్చాయి, ఉస్మానియా విశ్వవిద్యాలయం (1918) ఉర్దూలో బోధన మొదలుపెట్టింది."]],
 [["1920s – 1940s","1920లు – 1940లు"],["Andhra Mahasabha and the awakening","ఆంధ్ర మహాసభ, ప్రజా చైతన్యం"],["Library and Telugu-language movements grew into the Andhra Mahasabha, which demanded rights for people under feudal landlords. The Arya Samaj and the State Congress also campaigned for responsible government.","గ్రంథాలయ, తెలుగు భాషా ఉద్యమాలు ఆంధ్ర మహాసభగా ఎదిగి, భూస్వాముల కింద నలిగిన ప్రజల హక్కుల కోసం పోరాడాయి. ఆర్య సమాజం, స్టేట్ కాంగ్రెస్ కూడా బాధ్యతాయుత ప్రభుత్వం కోసం ఉద్యమించాయి."]],
 [["1946 – 1951","1946 – 1951"],["Telangana armed struggle","తెలంగాణ సాయుధ పోరాటం"],["Peasants rose against forced labour (vetti), feudal landlords and the Razakars. Chakali Ilamma's stand for her land and the death of Doddi Komaraiah became its symbols.","వెట్టిచాకిరీ, భూస్వాములు, రజాకార్లకు వ్యతిరేకంగా రైతులు తిరగబడ్డారు. తన భూమి కోసం చాకలి ఐలమ్మ చేసిన పోరాటం, దొడ్డి కొమరయ్య బలిదానం దీనికి ప్రతీకలయ్యాయి."]],
 [["17 September 1948","17 సెప్టెంబర్ 1948"],["Hyderabad joins India","హైదరాబాద్ భారత్‌లో విలీనం"],["After the police action (Operation Polo), the Nizam surrendered and Hyderabad State became part of India.","పోలీసు చర్య (ఆపరేషన్ పోలో) తర్వాత నిజాం లొంగిపోయాడు; హైదరాబాద్ రాజ్యం భారతదేశంలో భాగమైంది."]],
 [["1952","1952"],["First elected government and the Mulki agitation","తొలి ఎన్నికైన ప్రభుత్వం, ముల్కీ ఉద్యమం"],["Burgula Ramakrishna Rao became the first elected Chief Minister of Hyderabad State. Students protested for jobs to be kept for locals (Mulkis).","బూర్గుల రామకృష్ణారావు హైదరాబాద్ రాష్ట్ర తొలి ఎన్నికైన ముఖ్యమంత్రి అయ్యారు. ఉద్యోగాలు స్థానికులకే (ముల్కీలు) ఇవ్వాలని విద్యార్థులు ఉద్యమించారు."]],
 [["1 November 1956","1 నవంబర్ 1956"],["Andhra Pradesh formed","ఆంధ్రప్రదేశ్ ఏర్పాటు"],["The Telugu-speaking Telangana region merged with Andhra State to form Andhra Pradesh, with Hyderabad as capital. The Gentlemen's Agreement promised safeguards for Telangana.","తెలుగు మాట్లాడే తెలంగాణ ప్రాంతం ఆంధ్ర రాష్ట్రంతో కలిసి హైదరాబాద్ రాజధానిగా ఆంధ్రప్రదేశ్ ఏర్పడింది. పెద్దమనుషుల ఒప్పందం తెలంగాణకు రక్షణలు హామీ ఇచ్చింది."]],
 [["1969","1969"],["Jai Telangana movement","జై తెలంగాణ ఉద్యమం"],["Students and employees agitated over unfulfilled safeguards and demanded a separate state; many young lives were lost.","హామీలు అమలు కాకపోవడంపై విద్యార్థులు, ఉద్యోగులు ఉద్యమించి ప్రత్యేక రాష్ట్రం కోరారు; ఎంతో మంది యువకులు ప్రాణాలు కోల్పోయారు."]],
 [["2001 – 2014","2001 – 2014"],["Statehood movement","ప్రత్యేక రాష్ట్ర ఉద్యమం"],["A renewed movement of students, employees, writers, artists and political parties, with mass protests like the Sakala Janula Samme (general strike), pressed for statehood.","విద్యార్థులు, ఉద్యోగులు, రచయితలు, కళాకారులు, రాజకీయ పార్టీలు కలిసి సకల జనుల సమ్మె వంటి భారీ నిరసనలతో ప్రత్యేక రాష్ట్రం కోసం ఉద్యమించారు."]],
 [["2 June 2014","2 జూన్ 2014"],["Telangana State","తెలంగాణ రాష్ట్రం"],["Telangana became India's 29th state with 10 districts. Hyderabad served as the shared capital with Andhra Pradesh until 2 June 2024.","తెలంగాణ 10 జిల్లాలతో భారతదేశంలో 29వ రాష్ట్రంగా ఏర్పడింది. 2 జూన్ 2024 వరకు హైదరాబాద్ ఆంధ్రప్రదేశ్‌తో ఉమ్మడి రాజధానిగా ఉంది."]],
 [["2016 – 2019","2016 – 2019"],["New districts","కొత్త జిల్లాలు"],["Districts were reorganised from 10 to 31 in October 2016 and to 33 in February 2019 with Mulugu and Narayanpet.","అక్టోబర్ 2016లో జిల్లాలను 10 నుండి 31కి, ఫిబ్రవరి 2019లో ములుగు, నారాయణపేటతో 33కి పునర్వ్యవస్థీకరించారు."]]
];

  ["22",["Protection against arrest","అరెస్టు సమయంలో రక్షణ"],["An arrested person must be told why, may consult a lawyer of their choice, and must be produced before a magistrate within 24 hours.","అరెస్టయిన వ్యక్తికి కారణం చెప్పాలి; నచ్చిన న్యాయవాదిని సంప్రదించవచ్చు; 24 గంటల్లో మేజిస్ట్రేట్ ముందు హాజరుపరచాలి."],"9"]]},
 {k:"exploitation",t:["Right against Exploitation","దోపిడీకి వ్యతిరేక హక్కు"],arts:"23–24",rights:[
  ["23",["No trafficking or forced labour","మనుషుల అక్రమ రవాణా, వెట్టి చాకిరి నిషేధం"],["Human trafficking, begar (unpaid forced work) and other forced labour are banned and punishable.","మనుషుల అక్రమ రవాణా, వెట్టి చాకిరి, ఇతర బలవంతపు పనులు నిషేధం; శిక్షార్హం."],"4"],
  ["24",["No child labour in hazardous work","ప్రమాదకర పనుల్లో బాల కార్మికులు వద్దు"],["No child below 14 may be employed in a factory, mine or any other hazardous work.","14 ఏళ్లలోపు పిల్లలను కర్మాగారాలు, గనులు, ఇతర ప్రమాదకర పనుల్లో పెట్టకూడదు."],""]]},
 {k:"religion",t:["Right to Freedom of Religion","మత స్వేచ్ఛా హక్కు"],arts:"25–28",rights:[

  ["26",["Manage religious affairs","మత వ్యవహారాల నిర్వహణ"],["Religious groups may manage their own affairs and run institutions for religious and charitable purposes.","మత వర్గాలు తమ వ్యవహారాలను నిర్వహించుకోవచ్చు; మత, ధర్మ సంస్థలను నడపవచ్చు."],""],
  ["27",["No tax to promote a religion","మత ప్రచారానికి పన్ను లేదు"],["No one can be made to pay a tax that is used to promote a particular religion.","ఒక ప్రత్యేక మతం ప్రచారానికి వాడే పన్ను కట్టమని ఎవరినీ బలవంతం చేయకూడదు."],""],
  ["28",["No forced religious instruction","బలవంతపు మత బోధన లేదు"],["No religious instruction in institutions fully funded by the State, and no one can be forced to attend it in State-aided ones.","పూర్తిగా ప్రభుత్వ నిధులతో నడిచే సంస్థల్లో మత బోధన ఉండదు; ప్రభుత్వ సహాయం పొందే సంస్థల్లో కూడా బలవంతంగా హాజరుపరచకూడదు."],""]]},

  ["30",["Minorities' educational institutions","మైనారిటీల విద్యా సంస్థలు"],["Religious and linguistic minorities may set up and run educational institutions of their choice.","మత, భాషా మైనారిటీలు తమకు నచ్చిన విద్యా సంస్థలను స్థాపించి నడపవచ్చు."],"26"]]},
 {k:"remedies",t:["Right to Constitutional Remedies","రాజ్యాంగ పరిహారాల హక్కు"],arts:"32, 226",rights:[
  ["32",["Go to the Supreme Court","సుప్రీంకోర్టును ఆశ్రయించే హక్కు"],["Anyone can approach the Supreme Court directly to enforce these rights. Dr. B. R. Ambedkar called this article the heart and soul of the Constitution.","ఈ హక్కుల అమలు కోసం ఎవరైనా నేరుగా సుప్రీంకోర్టును ఆశ్రయించవచ్చు. డా. బి.ఆర్. అంబేద్కర్ ఈ ఆర్టికల్‌ను రాజ్యాంగానికి హృదయం, ఆత్మ అన్నారు."],"8"],
  ["226",["Go to the High Court","హైకోర్టును ఆశ్రయించే హక్కు"],["The High Court of Andhra Pradesh at Amaravati can issue writs to enforce fundamental rights and other legal rights.","ప్రాథమిక హక్కులు, ఇతర చట్టపరమైన హక్కుల అమలుకు అమరావతిలోని ఆంధ్రప్రదేశ్ హైకోర్టు రిట్లు జారీ చేయగలదు."],"8"]]}

const PREAMBLE_EN="WE, THE PEOPLE OF INDIA, having solemnly resolved to constitute India into a SOVEREIGN SOCIALIST SECULAR DEMOCRATIC REPUBLIC and to secure to all its citizens: JUSTICE, social, economic and political; LIBERTY of thought, expression, belief, faith and worship; EQUALITY of status and of opportunity; and to promote among them all FRATERNITY assuring the dignity of the individual and the unity and integrity of the Nation; IN OUR CONSTITUENT ASSEMBLY this twenty-sixth day of November, 1949, do HEREBY ADOPT, ENACT AND GIVE TO OURSELVES THIS CONSTITUTION.";
const PREAMBLE_TE="భారత ప్రజలమైన మేము, భారతదేశాన్ని సర్వసత్తాక సామ్యవాద లౌకిక ప్రజాస్వామ్య గణతంత్ర రాజ్యంగా నిర్మించుకోవడానికి, పౌరులందరికీ సామాజిక, ఆర్థిక, రాజకీయ న్యాయాన్ని; ఆలోచన, భావ ప్రకటన, విశ్వాసం, ధర్మం, ఆరాధనలలో స్వేచ్ఛను; హోదాలోనూ అవకాశాలలోనూ సమానత్వాన్ని చేకూర్చడానికి; వ్యక్తి గౌరవాన్ని, దేశ ఐక్యతను, సమగ్రతను కాపాడే సౌభ్రాతృత్వాన్ని వారందరిలో పెంపొందించడానికి సత్యనిష్ఠతో తీర్మానించుకొని, మన రాజ్యాంగ పరిషత్తులో 1949 నవంబర్ 26వ తేదీన ఈ రాజ్యాంగాన్ని ఆమోదించి, శాసనంగా రూపొందించుకొని, మాకు మేమే సమర్పించుకుంటున్నాము.";

 [["2nd century BCE – 3rd century CE","క్రీ.పూ. 2వ శతాబ్దం – క్రీ.శ. 3వ శతాబ్దం"],["Satavahanas","శాతవాహనులు"],["Ruled the Deccan with Dhanyakataka (Amaravati) as a major centre. Amaravati became a great Buddhist centre, famous for its stupa.","ధాన్యకటకం (అమరావతి) ముఖ్య కేంద్రంగా దక్కన్‌ను పాలించారు. అమరావతి స్తూపంతో ప్రసిద్ధ బౌద్ధ కేంద్రంగా వెలిసింది."]],
 [["3rd – 4th century CE","క్రీ.శ. 3వ – 4వ శతాబ్దం"],["Ikshvakus","ఇక్ష్వాకులు"],["Ruled from Vijayapuri in the Krishna valley (Nagarjunakonda), a centre of Buddhist learning.","కృష్ణా లోయలోని విజయపురి (నాగార్జునకొండ) నుండి పాలించారు; ఇది బౌద్ధ విద్యా కేంద్రం."]],
 [["7th – 11th century","7వ – 11వ శతాబ్దం"],["Eastern Chalukyas of Vengi","వేంగి తూర్పు చాళుక్యులు"],["Founded by Kubja Vishnuvardhana at Vengi near Eluru. In the court of Rajaraja Narendra, Nannaya began the Telugu Mahabharatam, the first great work of Telugu literature.","ఏలూరు సమీపంలోని వేంగి కేంద్రంగా కుబ్జ విష్ణువర్ధనుడు స్థాపించాడు. రాజరాజ నరేంద్రుని ఆస్థానంలో నన్నయ తెలుగు మహాభారతాన్ని ప్రారంభించారు; ఇది తెలుగు సాహిత్యంలో తొలి మహా కావ్యం."]],
 [["10th – 12th century","10వ – 12వ శతాబ్దం"],["Cholas and the Chola–Chalukyas","చోళులు, చోళ–చాళుక్యులు"],["The Cholas of the Tamil country bound themselves to the Eastern Chalukyas through marriages, and Kulottunga I later united the two lines. Telugu Choda chiefs ruled the Nellore region.","తమిళ ప్రాంత చోళులు వివాహ సంబంధాల ద్వారా తూర్పు చాళుక్యులతో కలిశారు; తర్వాత కులోత్తుంగ చోళుడు I రెండు వంశాలనూ ఏకం చేశాడు. నెల్లూరు ప్రాంతాన్ని తెలుగు చోడ రాజులు పాలించారు."]],
 [["5th – 15th century","5వ – 15వ శతాబ్దం"],["Eastern Gangas and Gajapatis of Kalinga","కళింగ తూర్పు గంగులు, గజపతులు"],["The Eastern Gangas ruled the Kalinga coast, including today's Srikakulam, with an early capital at Mukhalingam (Kalinganagara). The Gajapatis of Odisha later held coastal Andhra until the 16th century.","నేటి శ్రీకాకుళంతో సహా కళింగ తీరాన్ని తూర్పు గంగులు పాలించారు; తొలి రాజధాని ముఖలింగం (కళింగనగరం). తర్వాత ఒడిశా గజపతులు 16వ శతాబ్దం వరకు తీరాంధ్రను పాలించారు."]],
 [["12th – 14th century","12వ – 14వ శతాబ్దం"],["Kakatiyas","కాకతీయులు"],["Ruled from Orugallu (Warangal) and united most Telugu-speaking lands, building tanks for farming. Rudrama Devi was one of India's few women rulers. The dynasty ended when Prataparudra was defeated by the Delhi Sultanate.","ఓరుగల్లు (వరంగల్) నుండి పాలించి తెలుగు ప్రాంతాలను చాలావరకు ఏకం చేశారు; సాగు కోసం చెరువులు నిర్మించారు. రుద్రమదేవి భారతదేశంలోని అరుదైన మహిళా పాలకుల్లో ఒకరు. ఢిల్లీ సుల్తానుల చేతిలో ప్రతాపరుద్రుని ఓటమితో వంశం ముగిసింది."]],
 [["14th – 15th century","14వ – 15వ శతాబ్దం"],["Musunuri Nayaks and the Reddy kingdom","ముసునూరి నాయకులు, రెడ్డి రాజ్యం"],["After the Kakatiyas, the Musunuri Nayaks drove out the Sultanate's forces. The Reddy kings ruled coastal Andhra from Addanki and Kondaveedu and patronised poets such as Srinatha.","కాకతీయుల తర్వాత ముసునూరి నాయకులు సుల్తానుల సేనలను తరిమికొట్టారు. రెడ్డి రాజులు అద్దంకి, కొండవీడు నుండి తీరాంధ్రను పాలించి శ్రీనాథుడు వంటి కవులను పోషించారు."]],
 [["14th – 17th century","14వ – 17వ శతాబ్దం"],["Vijayanagara Empire","విజయనగర సామ్రాజ్యం"],["Founded by Harihara and Bukka. In the 16th century, Sri Krishnadevaraya made his court a golden age of Telugu literature with the Ashtadiggajas, including Allasani Peddana and Tenali Ramakrishna, and wrote that Telugu is the finest of the languages. After the Battle of Talikota the empire moved its capital to Penukonda and later Chandragiri.","హరిహర, బుక్కరాయలు స్థాపించారు. 16వ శతాబ్దంలో శ్రీకృష్ణదేవరాయలు అల్లసాని పెద్దన, తెనాలి రామకృష్ణ వంటి అష్టదిగ్గజాలతో తెలుగు సాహిత్యానికి స్వర్ణయుగం తెచ్చారు; “దేశ భాషలందు తెలుగు లెస్స” అని రాశారు. తళ్లికోట యుద్ధం తర్వాత రాజధాని పెనుకొండకు, ఆ తర్వాత చంద్రగిరికి మారింది."]],
 [["16th – 17th century","16వ – 17వ శతాబ్దం"],["Qutb Shahis of Golconda","గోల్కొండ కుతుబ్ షాహీలు"],["Ruled from Golconda and built the city of Hyderabad and the Charminar. Telugu was valued at court, and Bhakta Ramadasu built the Bhadrachalam temple in this period.","గోల్కొండ నుండి పాలించి హైదరాబాద్ నగరాన్ని, చార్మినార్‌ను నిర్మించారు. ఆస్థానంలో తెలుగుకు ఆదరణ ఉండేది; ఈ కాలంలోనే భక్త రామదాసు భద్రాచలం ఆలయాన్ని నిర్మించారు."]],
 [["17th – 20th century","17వ – 20వ శతాబ్దం"],["Mughals and the Nizams","మొఘలులు, నిజాములు"],["Aurangzeb took Golconda, and in the 18th century the Asaf Jahi Nizams began ruling from Hyderabad and later handed the coastal and Rayalaseema districts to the British. Hyderabad State joined India in 1948.","ఔరంగజేబు గోల్కొండను జయించాడు; 18వ శతాబ్దం నుండి అసఫ్ జాహీ నిజాములు హైదరాబాద్ నుండి పాలించారు; తర్వాత తీర, రాయలసీమ జిల్లాలను బ్రిటిష్ వారికి అప్పగించారు. 1948లో హైదరాబాద్ సంస్థానం భారతదేశంలో విలీనమైంది."]],
 ["1757 – 1947",["British rule","బ్రిటిష్ పాలన"],["After the Battle of Bobbili (1757), the Northern Circars (coastal Andhra) passed to the East India Company in 1765–66 and the Ceded Districts (Rayalaseema) in 1800, both in the Madras Presidency. Sir Arthur Cotton's anicut on the Godavari (1852) turned the delta into a rice bowl.","బొబ్బిలి యుద్ధం (1757) తర్వాత ఉత్తర సర్కారులు (తీరాంధ్ర) 1765–66లో, దత్త మండలాలు (రాయలసీమ) 1800లో ఈస్టిండియా కంపెనీకి వెళ్లి మద్రాసు ప్రెసిడెన్సీలో భాగమయ్యాయి. సర్ ఆర్థర్ కాటన్ గోదావరిపై నిర్మించిన ఆనకట్ట (1852) డెల్టాను అన్నపూర్ణగా మార్చింది."]],
 ["1913 – 1947",["Freedom struggle and the Andhra movement","స్వాతంత్ర్య పోరాటం, ఆంధ్రోద్యమం"],["The Andhra Mahasabha (1913) began the call for a Telugu state. Pingali Venkayya designed the flag that became the basis of the National Flag; Duggirala Gopalakrishnayya led the Chirala–Perala movement (1921); Alluri Sitarama Raju led the Rampa rebellion (1922–24); Tanguturi Prakasam defied police guns at a Simon Commission protest in Madras (1928).","ఆంధ్ర మహాసభ (1913) తెలుగు రాష్ట్ర డిమాండ్‌ను ప్రారంభించింది. జాతీయ పతాకానికి ఆధారమైన జెండాను పింగళి వెంకయ్య రూపొందించారు; దుగ్గిరాల గోపాలకృష్ణయ్య చీరాల–పేరాల ఉద్యమాన్ని (1921) నడిపారు; అల్లూరి సీతారామరాజు రంప పోరాటం (1922–24) సాగించారు; మద్రాసులో సైమన్ కమిషన్ వ్యతిరేక నిరసనలో (1928) టంగుటూరి ప్రకాశం పోలీసు తుపాకులకు ఎదురు నిలిచారు."]],
 ["19 Oct – 15 Dec 1952",["Potti Sriramulu's sacrifice","పొట్టి శ్రీరాములు ఆత్మార్పణ"],["Potti Sriramulu fasted for 58 days in Madras demanding a separate state for Telugu people, and died on 15 December 1952. He is remembered as Amarajeevi (immortal soul).","తెలుగు ప్రజలకు ప్రత్యేక రాష్ట్రం కోసం పొట్టి శ్రీరాములు మద్రాసులో 58 రోజులు నిరాహార దీక్ష చేసి 1952 డిసెంబర్ 15న అసువులు బాశారు. ఆయనను “అమరజీవి”గా స్మరిస్తారు."]],
 ["1 October 1953",["Andhra State","ఆంధ్ర రాష్ట్రం"],["Andhra State was formed from the Telugu districts of Madras State, with Kurnool as capital and Tanguturi Prakasam as Chief Minister. It was the first Indian state formed on the basis of language.","మద్రాసు రాష్ట్రంలోని తెలుగు జిల్లాలతో ఆంధ్ర రాష్ట్రం ఏర్పడింది; రాజధాని కర్నూలు, ముఖ్యమంత్రి టంగుటూరి ప్రకాశం. భాషా ప్రాతిపదికన ఏర్పడిన తొలి భారతీయ రాష్ట్రం ఇదే."]],
 ["1 November 1956",["Andhra Pradesh","ఆంధ్రప్రదేశ్"],["Andhra State merged with the Telugu-speaking Telangana region of Hyderabad State to form Andhra Pradesh, with Hyderabad as capital. Neelam Sanjiva Reddy became the first Chief Minister.","ఆంధ్ర రాష్ట్రం, హైదరాబాద్ సంస్థానంలోని తెలుగు మాట్లాడే తెలంగాణ ప్రాంతం కలిసి ఆంధ్రప్రదేశ్ ఏర్పడింది; రాజధాని హైదరాబాద్. నీలం సంజీవరెడ్డి తొలి ముఖ్యమంత్రి అయ్యారు."]],
 ["2 June 2014",["Bifurcation","రాష్ట్ర విభజన"],["Telangana became a separate state. Andhra Pradesh kept 13 districts and began building Amaravati as its new capital.","తెలంగాణ ప్రత్యేక రాష్ట్రమైంది. ఆంధ్రప్రదేశ్‌కు 13 జిల్లాలు మిగిలాయి; అమరావతిని కొత్త రాజధానిగా నిర్మించడం ప్రారంభించింది."]],
 ["2022 – 2025",["New districts","కొత్త జిల్లాలు"],["13 new districts came into force on 4 April 2022, making 26. Markapuram and Polavaram districts were added on 31 December 2025, making 28.","2022 ఏప్రిల్ 4న 13 కొత్త జిల్లాలు ఏర్పడి మొత్తం 26 అయ్యాయి. 2025 డిసెంబర్ 31న మార్కాపురం, పోలవరం జిల్లాలు చేరి మొత్తం 28 అయ్యాయి."]]

 ["Kandukuri Veeresalingam","కందుకూరి వీరేశలింగం","1848–1919","Social reformer of Rajahmundry who championed widow remarriage and women's education.","వితంతు పునర్వివాహం, స్త్రీ విద్య కోసం పోరాడిన రాజమండ్రి సంఘ సంస్కర్త."],
 ["Gurajada Apparao","గురజాడ అప్పారావు","1862–1915","Writer from Vizianagaram whose play Kanyasulkam brought spoken Telugu into literature.","కన్యాశుల్కం నాటకంతో వాడుక తెలుగును సాహిత్యంలోకి తెచ్చిన విజయనగరం రచయిత."],

 ["Tanguturi Prakasam","టంగుటూరి ప్రకాశం","1872–1957","Andhra Kesari, freedom fighter and the first Chief Minister of Andhra State (1953).","ఆంధ్రకేసరి; స్వాతంత్ర్య సమరయోధుడు, ఆంధ్ర రాష్ట్ర తొలి ముఖ్యమంత్రి (1953)."],
 ["Alluri Sitarama Raju","అల్లూరి సీతారామరాజు","1897–1924","Led the Rampa rebellion of tribal people against British rule in the Eastern Ghats.","తూర్పు కనుమల్లో బ్రిటిష్ పాలనకు వ్యతిరేకంగా గిరిజనులతో రంప పోరాటం నడిపిన వీరుడు."],
 ["Potti Sriramulu","పొట్టి శ్రీరాములు","1901–1952","Amarajeevi, who gave his life fasting for a separate Telugu state, leading to Andhra State in 1953.","అమరజీవి; తెలుగు రాష్ట్రం కోసం నిరాహార దీక్షలో ప్రాణాలు అర్పించారు; దాని ఫలితంగా 1953లో ఆంధ్ర రాష్ట్రం ఏర్పడింది."],

 "Annamayya":["Madanapalle","మదనపల్లె",["Named after the saint-composer Annamacharya, born at Tallapaka in this district.","ఈ జిల్లాలోని తాళ్లపాకలో జన్మించిన వాగ్గేయకారుడు అన్నమాచార్యుల పేరు పెట్టారు."],["Horsley Hills; Madanapalle, where Rabindranath Tagore translated Jana Gana Mana into English in 1919.","హార్సిలీ హిల్స్; 1919లో రవీంద్రనాథ్ ఠాగూర్ జనగణమనను ఇంగ్లీషులోకి అనువదించిన మదనపల్లె."],["Major tomato market at Madanapalle, mangoes and silk.","మదనపల్లె టమాటా మార్కెట్, మామిడి, పట్టు."]],
 "Bapatla":["Bapatla","బాపట్ల",["Named after its headquarters town, home of the ancient Bhavanarayana Swamy temple.","పురాతన భావనారాయణ స్వామి ఆలయం ఉన్న జిల్లా కేంద్రం పేరు."],["Suryalanka beach; Chirala handlooms and the Chirala–Perala movement.","సూర్యలంక బీచ్; చీరాల చేనేత, చీరాల–పేరాల ఉద్యమం."],["Paddy, aquaculture, handloom weaving and agricultural education.","వరి, ఆక్వాకల్చర్, చేనేత, వ్యవసాయ విద్య."]],

 "Dr. B. R. Ambedkar Konaseema":["Amalapuram","అమలాపురం",["Named after Dr. B. R. Ambedkar; Konaseema means the land between the branches of the Godavari.","డా. బి.ఆర్. అంబేద్కర్ పేరు; కోనసీమ అంటే గోదావరి పాయల మధ్య భూమి."],["Coconut groves, backwaters and the Godavari delta landscape.","కొబ్బరి తోటలు, కాలువలు, గోదావరి డెల్టా అందాలు."],["Coconut, paddy and onshore natural gas.","కొబ్బరి, వరి, సహజ వాయువు."]],

 "Eluru":["Eluru","ఏలూరు",["Named after its headquarters town, close to ancient Vengi of the Eastern Chalukyas.","తూర్పు చాళుక్యుల పురాతన వేంగి సమీపంలోని జిల్లా కేంద్రం పేరు."],["Kolleru lake bird sanctuary, Dwaraka Tirumala temple and Eluru carpets.","కొల్లేరు సరస్సు పక్షుల అభయారణ్యం, ద్వారకా తిరుమల ఆలయం, ఏలూరు తివాచీలు."],["Fish and prawn farming, oil palm and paddy.","చేపలు, రొయ్యల సాగు, ఆయిల్ పామ్, వరి."]],
 "Guntur":["Guntur","గుంటూరు",["Named after its headquarters city.","జిల్లా కేంద్ర నగరం పేరు."],["Guntur chillies and one of Asia's largest chilli markets; part of the Amaravati capital region.","గుంటూరు మిర్చి, ఆసియాలోని అతిపెద్ద మిర్చి యార్డుల్లో ఒకటి; అమరావతి రాజధాని ప్రాంతంలో భాగం."],["Chilli, cotton and tobacco trade; education and health hub.","మిర్చి, పత్తి, పొగాకు వ్యాపారం; విద్య, వైద్య కేంద్రం."]],
 "Kakinada":["Kakinada","కాకినాడ",["Named after its port city.","ఓడరేవు నగరం పేరు."],["Deep-water port, Kakinada kaja sweet and the Pithapuram temple.","లోతైన ఓడరేవు, కాకినాడ కాజా, పిఠాపురం ఆలయం."],["Port trade, fertiliser plants and Krishna–Godavari basin natural gas.","ఓడరేవు వ్యాపారం, ఎరువుల కర్మాగారాలు, కృష్ణా–గోదావరి బేసిన్ సహజ వాయువు."]],
 "Krishna":["Machilipatnam","మచిలీపట్నం",["Named after the Krishna river.","కృష్ణా నది పేరు."],["Machilipatnam, an ancient port; Kalamkari art of Pedana; Bandar laddu.","పురాతన ఓడరేవు మచిలీపట్నం; పెడన కలంకారీ కళ; బందరు లడ్డు."],["Paddy, aquaculture and Kalamkari exports.","వరి, ఆక్వాకల్చర్, కలంకారీ ఎగుమతులు."]],
 "Kurnool":["Kurnool","కర్నూలు",["Named after its headquarters city, the first capital of Andhra State (1953–56).","ఆంధ్ర రాష్ట్ర తొలి రాజధాని (1953–56) అయిన జిల్లా కేంద్రం పేరు."],["Konda Reddy fort and the Mantralayam Raghavendra Swamy temple on the Tungabhadra.","కొండారెడ్డి బురుజు, తుంగభద్ర తీరాన మంత్రాలయం రాఘవేంద్ర స్వామి మఠం."],["Cotton (Adoni market), groundnut and industrial growth near Orvakal.","పత్తి (ఆదోని మార్కెట్), వేరుశనగ, ఓర్వకల్ వద్ద పారిశ్రామిక అభివృద్ధి."]],

 "Nandyal":["Nandyal","నంద్యాల",["Linked with the nine Nandi temples (Nava Nandulu) around the town.","పట్టణం చుట్టూ ఉన్న నవ నందులతో ఈ పేరు ముడిపడి ఉంది."],["Srisailam Mallikarjuna Jyotirlinga, Ahobilam, Mahanandi and Belum Caves.","శ్రీశైలం మల్లికార్జున జ్యోతిర్లింగం, అహోబిలం, మహానంది, బెలుం గుహలు."],["Hydropower from Srisailam, rice and pilgrimage tourism.","శ్రీశైలం జలవిద్యుత్, వరి, పుణ్యక్షేత్ర పర్యాటకం."]],
 "NTR":["Vijayawada","విజయవాడ",["Named after N. T. Rama Rao, film legend and former Chief Minister.","సినీ దిగ్గజం, మాజీ ముఖ్యమంత్రి ఎన్.టి. రామారావు పేరు పెట్టారు."],["Kanaka Durga temple on Indrakeeladri, Prakasam Barrage and Kondapalli toys.","ఇంద్రకీలాద్రిపై కనకదుర్గ ఆలయం, ప్రకాశం బ్యారేజీ, కొండపల్లి బొమ్మలు."],["Trade and transport hub of the state, with one of India's busiest railway junctions.","రాష్ట్ర వ్యాపార, రవాణా కేంద్రం; దేశంలోని రద్దీగా ఉండే రైల్వే జంక్షన్లలో ఒకటి."]],
 "Palnadu":["Narasaraopeta","నరసరావుపేట",["Named after the historic Palnadu region, scene of the 12th-century Palnati Yuddham.","12వ శతాబ్దపు పల్నాటి యుద్ధం జరిగిన చారిత్రక పల్నాడు ప్రాంతం పేరు."],["Kotappakonda temple and the right bank of Nagarjuna Sagar.","కోటప్పకొండ ఆలయం, నాగార్జున సాగర్ కుడి కాలువ ప్రాంతం."],["Irrigated cotton and chillies, and cement industry.","సాగునీటితో పత్తి, మిర్చి; సిమెంట్ పరిశ్రమ."]],
