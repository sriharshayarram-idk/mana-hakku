[4,1955,0,"Said courts cannot question the amount of compensation when the State takes private property, and allowed the State to run trade itself.","ప్రభుత్వం ప్రైవేట్ ఆస్తి తీసుకున్నప్పుడు నష్టపరిహారం మొత్తాన్ని కోర్టులు ప్రశ్నించలేవు; ప్రభుత్వమే వ్యాపారం నడపవచ్చు."],
[5,1955,0,"Let the President fix a time limit for states to give their views when Parliament changes their boundaries.","రాష్ట్ర సరిహద్దులు మార్చే బిల్లులపై రాష్ట్రాలు అభిప్రాయం చెప్పేందుకు రాష్ట్రపతి గడువు విధించవచ్చు."],
[6,1956,0,"Gave Parliament the power to tax goods sold from one state to another.","ఒక రాష్ట్రం నుండి మరో రాష్ట్రానికి అమ్మే వస్తువులపై పన్ను విధించే అధికారం పార్లమెంటుకు ఇచ్చారు."],
[7,1956,1,"Reorganised the states on the basis of language into 14 states and 6 Union Territories, from 1 November 1956, the day Andhra Pradesh was formed.","భాషా ప్రాతిపదికన రాష్ట్రాలను 14 రాష్ట్రాలు, 6 కేంద్ర పాలిత ప్రాంతాలుగా పునర్వ్యవస్థీకరించారు; ఆంధ్రప్రదేశ్ ఏర్పడిన 1956 నవంబర్ 1 నుండి అమలు."],
[8,1960,0,"Extended reserved seats for SCs, STs and Anglo-Indians in Parliament and the assemblies by 10 years, to 1970.","పార్లమెంటు, శాసనసభల్లో SC, ST, ఆంగ్లో-ఇండియన్ల రిజర్వ్డ్ స్థానాలను 10 ఏళ్లు (1970 వరకు) పొడిగించారు."],
[9,1960,0,"Allowed India to hand over the Berubari area to Pakistan (today's Bangladesh) under an agreement.","ఒప్పందం ప్రకారం బెరుబారి ప్రాంతాన్ని పాకిస్తాన్‌కు (నేటి బంగ్లాదేశ్) అప్పగించేందుకు అనుమతి."],
[10,1961,0,"Made Dadra and Nagar Haveli, freed from Portuguese rule, part of India as a Union Territory.","పోర్చుగీస్ పాలన నుండి విముక్తి పొందిన దాద్రా, నగర్ హవేలీని కేంద్ర పాలిత ప్రాంతంగా భారతదేశంలో చేర్చారు."],
[11,1961,0,"Changed the Vice-President's election to a vote by members of both Houses of Parliament.","ఉపరాష్ట్రపతిని పార్లమెంటు ఉభయ సభల సభ్యులు ఎన్నుకునేలా మార్చారు."],
[12,1962,0,"Made Goa, Daman and Diu part of India as a Union Territory.","గోవా, డామన్, డయ్యూను కేంద్ర పాలిత ప్రాంతంగా భారతదేశంలో చేర్చారు."],
[13,1962,0,"Created Nagaland as a state, with special protection for Naga customs and land (Article 371A).","నాగా ఆచారాలు, భూములకు ప్రత్యేక రక్షణతో నాగాలాండ్ రాష్ట్రాన్ని ఏర్పాటు చేశారు (ఆర్టికల్ 371A)."],
[14,1962,0,"Made Puducherry part of India and allowed some Union Territories to have their own assemblies.","పుదుచ్చేరిని భారతదేశంలో చేర్చారు; కొన్ని కేంద్ర పాలిత ప్రాంతాలకు శాసనసభలకు అనుమతి."],
[15,1963,0,"Raised the retirement age of High Court judges from 60 to 62, and let High Courts issue orders beyond their own state.","హైకోర్టు న్యాయమూర్తుల పదవీ విరమణ వయస్సును 60 నుండి 62కు పెంచారు; హైకోర్టులు తమ రాష్ట్రం బయట కూడా ఆదేశాలు ఇవ్వవచ్చు."],
[16,1963,0,"Allowed limits on freedoms to protect India's sovereignty and integrity, and added this to oaths of office.","భారత సార్వభౌమత్వం, సమగ్రత రక్షణకు స్వేచ్ఛలపై పరిమితులకు అనుమతి; పదవీ ప్రమాణాల్లో దీన్ని చేర్చారు."],
[17,1964,0,"Protected land that farmers cultivate themselves from being taken without market-value compensation, and added more land laws to the Ninth Schedule.","రైతులు స్వయంగా సాగుచేసే భూమిని మార్కెట్ విలువ చెల్లించకుండా తీసుకోకుండా రక్షణ; మరిన్ని భూ చట్టాలు తొమ్మిదో షెడ్యూల్‌లో."],
[18,1966,0,"Made clear that Parliament can create new states and Union Territories and change their boundaries.","కొత్త రాష్ట్రాలు, కేంద్ర పాలిత ప్రాంతాలను ఏర్పాటు చేసి, సరిహద్దులు మార్చే అధికారం పార్లమెంటుకు ఉందని స్పష్టం చేశారు."],
[19,1966,0,"Abolished Election Tribunals; election disputes now go to the High Courts.","ఎన్నికల ట్రిబ్యునళ్లను రద్దు చేశారు; ఎన్నికల వివాదాలు ఇప్పుడు హైకోర్టులకు వెళ్తాయి."],
[20,1966,0,"Made valid some district judge appointments that the Supreme Court had cancelled.","సుప్రీంకోర్టు రద్దు చేసిన కొన్ని జిల్లా న్యాయమూర్తుల నియామకాలను చెల్లుబాటు చేశారు."],
[21,1967,0,"Added Sindhi to the Eighth Schedule of languages.","సింధీ భాషను ఎనిమిదో షెడ్యూల్‌లో చేర్చారు."],
[22,1969,0,"Allowed Meghalaya to be formed as an autonomous state within Assam.","అస్సాంలో స్వయంప్రతిపత్తి రాష్ట్రంగా మేఘాలయ ఏర్పాటుకు అనుమతి."],
[23,1969,0,"Extended reserved seats for SCs, STs and Anglo-Indians by another 10 years, to 1980.","SC, ST, ఆంగ్లో-ఇండియన్ల రిజర్వ్డ్ స్థానాలను మరో 10 ఏళ్లు (1980 వరకు) పొడిగించారు."],
[24,1971,1,"Confirmed that Parliament can amend any part of the Constitution, including Fundamental Rights, and that the President must sign such amendments.","ప్రాథమిక హక్కులతో సహా రాజ్యాంగంలోని ఏ భాగాన్నైనా సవరించే అధికారం పార్లమెంటుకు ఉందని, అలాంటి సవరణలపై రాష్ట్రపతి తప్పనిసరిగా సంతకం చేయాలని ధృవీకరించారు."],
[25,1971,0,"Reduced the right to property and protected laws made to carry out certain Directive Principles from court challenge (Article 31C).","ఆస్తి హక్కును తగ్గించారు; కొన్ని ఆదేశిక సూత్రాల అమలుకు చేసిన చట్టాలను కోర్టు సవాళ్ల నుండి కాపాడారు (ఆర్టికల్ 31C)."],
[26,1971,0,"Ended the privy purses and special privileges of the former kings of princely states.","పూర్వపు సంస్థానాధీశుల రాజభరణాలు, ప్రత్యేక హక్కులను రద్దు చేశారు."],
[27,1971,0,"Made special arrangements for North-Eastern Union Territories and let their administrators issue ordinances.","ఈశాన్య కేంద్ర పాలిత ప్రాంతాలకు ప్రత్యేక ఏర్పాట్లు; వాటి పరిపాలకులు ఆర్డినెన్సులు జారీ చేయవచ్చు."],
[28,1972,0,"Ended the special privileges of former Indian Civil Service officers.","పూర్వపు ఇండియన్ సివిల్ సర్వీస్ అధికారుల ప్రత్యేక హక్కులను రద్దు చేశారు."],
[29,1972,0,"Added two Kerala land reform laws to the Ninth Schedule.","కేరళ రెండు భూ సంస్కరణ చట్టాలను తొమ్మిదో షెడ్యూల్‌లో చేర్చారు."],
[30,1972,0,"Allowed civil appeals to the Supreme Court only on important questions of law, not on the money value of the case.","సివిల్ కేసుల్లో విలువ ఆధారంగా కాకుండా ముఖ్యమైన న్యాయ ప్రశ్నలపై మాత్రమే సుప్రీంకోర్టుకు అప్పీలు."],
[31,1973,0,"Increased the maximum size of the Lok Sabha from 525 to 545 seats.","లోక్‌సభ గరిష్ఠ స్థానాలను 525 నుండి 545కు పెంచారు."],
[32,1973,2,"Added Articles 371D and 371E for Andhra Pradesh: local reservation by region in education and state jobs (the Six-Point Formula), a state administrative tribunal, and a central university in the state.","ఆంధ్రప్రదేశ్ కోసం ఆర్టికల్ 371D, 371E: ప్రాంతాల వారీగా విద్య, రాష్ట్ర ఉద్యోగాల్లో స్థానిక రిజర్వేషన్ (ఆరు సూత్రాల పథకం), రాష్ట్ర పరిపాలనా ట్రిబ్యునల్, రాష్ట్రంలో కేంద్ర విశ్వవిద్యాలయం."],
[33,1974,0,"Said an MP's or MLA's resignation is accepted only if it is voluntary and genuine.","స్వచ్ఛందంగా, నిజంగా ఇచ్చినప్పుడే ఎంపీ లేదా ఎమ్మెల్యే రాజీనామాను ఆమోదిస్తారు."],
[34,1974,0,"Added 20 more state land reform laws to the Ninth Schedule.","మరో 20 రాష్ట్ర భూ సంస్కరణ చట్టాలను తొమ్మిదో షెడ్యూల్‌లో చేర్చారు."],
[35,1974,0,"Made Sikkim an associate state of India.","సిక్కింను భారతదేశ అనుబంధ రాష్ట్రంగా చేశారు."],
[36,1975,0,"Made Sikkim a full state of India.","సిక్కింను పూర్తి భారతీయ రాష్ట్రంగా చేశారు."],
[37,1975,0,"Gave Arunachal Pradesh, then a Union Territory, its own assembly and council of ministers.","అప్పటి కేంద్ర పాలిత ప్రాంతం అరుణాచల్ ప్రదేశ్‌కు శాసనసభ, మంత్రిమండలి ఇచ్చారు."],
[38,1975,0,"During the Emergency, made the President's emergency declarations and ordinances immune from court review.","ఎమర్జెన్సీ కాలంలో రాష్ట్రపతి ఎమర్జెన్సీ ప్రకటనలు, ఆర్డినెన్సులను కోర్టులు సమీక్షించలేకుండా చేశారు."],
[39,1975,0,"During the Emergency, placed election disputes of the Prime Minister and the Speaker beyond the courts.","ఎమర్జెన్సీ కాలంలో ప్రధానమంత్రి, స్పీకర్ ఎన్నికల వివాదాలను కోర్టుల పరిధి నుండి తప్పించారు."],
[40,1976,0,"Gave Parliament power over India's territorial waters, continental shelf and exclusive economic zone in the sea.","భారత ప్రాదేశిక జలాలు, ఖండాంతర అంచు, సముద్ర ప్రత్యేక ఆర్థిక మండలంపై పార్లమెంటుకు అధికారం."],
[41,1976,0,"Raised the retirement age of State Public Service Commission members from 60 to 62.","రాష్ట్ర పబ్లిక్ సర్వీస్ కమిషన్ సభ్యుల పదవీ విరమణ వయస్సును 60 నుండి 62కు పెంచారు."],
[42,1976,1,"Called the mini-Constitution: added 'socialist', 'secular' and 'integrity' to the Preamble, added Fundamental Duties and new Directive Principles such as free legal aid and protecting the environment, and cut back the courts' powers during the Emergency.","‘చిన్న రాజ్యాంగం’ అంటారు: ప్రవేశికలో ‘సామ్యవాద’, ‘లౌకిక’, ‘సమగ్రత’ పదాలు చేర్చారు; ప్రాథమిక విధులు, ఉచిత న్యాయ సహాయం, పర్యావరణ రక్షణ వంటి కొత్త ఆదేశిక సూత్రాలు జోడించారు; ఎమర్జెన్సీలో కోర్టుల అధికారాలను తగ్గించారు."],
[43,1977,0,"After the Emergency, restored the powers of the Supreme Court and High Courts that the 42nd Amendment had cut.","ఎమర్జెన్సీ తర్వాత, 42వ సవరణ తగ్గించిన సుప్రీంకోర్టు, హైకోర్టుల అధికారాలను పునరుద్ధరించారు."],
[44,1978,1,"Removed the right to property from Fundamental Rights (it became a legal right under Article 300A), allowed an Emergency only for armed rebellion, and said Articles 20 and 21 (life and liberty) can never be suspended.","ఆస్తి హక్కును ప్రాథమిక హక్కుల నుండి తొలగించి ఆర్టికల్ 300A కింద చట్టపరమైన హక్కుగా మార్చారు; సాయుధ తిరుగుబాటుకు మాత్రమే ఎమర్జెన్సీ; ఆర్టికల్ 20, 21 (ప్రాణం, స్వేచ్ఛ) ఎప్పుడూ రద్దు కావు."],
[45,1980,0,"Extended reserved seats for SCs, STs and Anglo-Indians by 10 years, to 1990.","SC, ST, ఆంగ్లో-ఇండియన్ల రిజర్వ్డ్ స్థానాలను 10 ఏళ్లు (1990 వరకు) పొడిగించారు."],
[46,1982,0,"Helped states collect sales tax more effectively.","రాష్ట్రాలు అమ్మకపు పన్నును మరింత సమర్థంగా వసూలు చేసేందుకు సహాయపడింది."],
[47,1984,0,"Added 14 more land reform laws to the Ninth Schedule.","మరో 14 భూ సంస్కరణ చట్టాలను తొమ్మిదో షెడ్యూల్‌లో చేర్చారు."],
[48,1984,0,"Allowed President's Rule in Punjab to continue beyond one year.","పంజాబ్‌లో రాష్ట్రపతి పాలనను ఏడాదికి మించి కొనసాగించేందుకు అనుమతి."],
[49,1984,0,"Gave constitutional protection to the tribal autonomous district council of Tripura.","త్రిపుర గిరిజన స్వయంప్రతిపత్తి జిల్లా మండలికి రాజ్యాంగ రక్షణ ఇచ్చారు."],
[50,1984,0,"Allowed Parliament to limit some rights of the armed forces, intelligence and related staff for discipline and security.","క్రమశిక్షణ, భద్రత కోసం సాయుధ దళాలు, నిఘా సిబ్బంది కొన్ని హక్కులను పరిమితం చేసే అధికారం పార్లమెంటుకు."],
[51,1984,0,"Reserved seats for Scheduled Tribes in the Lok Sabha and assemblies of some North-Eastern states.","కొన్ని ఈశాన్య రాష్ట్రాల్లో లోక్‌సభ, శాసనసభల్లో షెడ్యూల్డ్ తెగలకు రిజర్వ్డ్ స్థానాలు."],
[52,1985,1,"Added the anti-defection law (Tenth Schedule): an MP or MLA who switches party can lose their seat.","పార్టీ ఫిరాయింపుల నిరోధక చట్టం (పదో షెడ్యూల్): పార్టీ మారే ఎంపీ లేదా ఎమ్మెల్యే పదవి కోల్పోవచ్చు."],
[53,1986,0,"Special provisions for Mizoram (Article 371G) to protect Mizo customs and land.","మిజో ఆచారాలు, భూముల రక్షణకు మిజోరాంకు ప్రత్యేక నిబంధనలు (ఆర్టికల్ 371G)."],

[57,1987,0,"Reserved assembly seats for Scheduled Tribes in Arunachal Pradesh, Meghalaya, Mizoram and Nagaland.","అరుణాచల్ ప్రదేశ్, మేఘాలయ, మిజోరాం, నాగాలాండ్ శాసనసభల్లో షెడ్యూల్డ్ తెగలకు రిజర్వ్డ్ స్థానాలు."],

[59,1988,0,"Allowed longer President's Rule in Punjab and an emergency there because of internal disturbance.","పంజాబ్‌లో రాష్ట్రపతి పాలన పొడిగింపు, అంతర్గత అలజడి కారణంగా అక్కడ ఎమర్జెన్సీకి అనుమతి."],

[62,1989,0,"Extended reserved seats for SCs, STs and Anglo-Indians by 10 years, to 2000.","SC, ST, ఆంగ్లో-ఇండియన్ల రిజర్వ్డ్ స్థానాలను 10 ఏళ్లు (2000 వరకు) పొడిగించారు."],

[68,1991,0,"Extended President's Rule in Punjab up to five years.","పంజాబ్‌లో రాష్ట్రపతి పాలనను ఐదేళ్ల వరకు పొడిగించారు."],

[71,1992,0,"Added Konkani, Manipuri and Nepali to the Eighth Schedule of languages.","కొంకణి, మణిపురి, నేపాలీ భాషలను ఎనిమిదో షెడ్యూల్‌లో చేర్చారు."],
[72,1992,0,"Reserved seats for Scheduled Tribes in the Tripura assembly.","త్రిపుర శాసనసభలో షెడ్యూల్డ్ తెగలకు రిజర్వ్డ్ స్థానాలు."],
[73,1992,1,"Gave constitutional status to Panchayats at village, mandal and district level: elections every 5 years, Gram Sabhas, and reserved seats for SCs, STs and women (at least one-third for women).","గ్రామ, మండల, జిల్లా స్థాయి పంచాయతీలకు రాజ్యాంగ హోదా: ప్రతి 5 ఏళ్లకు ఎన్నికలు, గ్రామసభలు; SC, ST, మహిళలకు రిజర్వేషన్ (మహిళలకు కనీసం మూడో వంతు)."],
[74,1992,1,"Gave the same constitutional status to municipalities in towns and cities, with regular elections and reserved seats.","పట్టణాలు, నగరాల మున్సిపాలిటీలకు అదే రాజ్యాంగ హోదా; క్రమం తప్పని ఎన్నికలు, రిజర్వేషన్లు."],
[75,1994,0,"Allowed rent tribunals to settle disputes between landlords and tenants.","ఇంటి యజమానులు, అద్దెదారుల వివాదాల పరిష్కారానికి అద్దె ట్రిబ్యునళ్లకు అనుమతి."],
[76,1994,0,"Placed Tamil Nadu's 69% reservation law in the Ninth Schedule.","తమిళనాడు 69% రిజర్వేషన్ చట్టాన్ని తొమ్మిదో షెడ్యూల్‌లో చేర్చారు."],

[78,1995,0,"Added 27 more land reform laws to the Ninth Schedule.","మరో 27 భూ సంస్కరణ చట్టాలను తొమ్మిదో షెడ్యూల్‌లో చేర్చారు."],
[79,1999,0,"Extended reserved seats for SCs, STs and Anglo-Indians by 10 years, to 2010.","SC, ST, ఆంగ్లో-ఇండియన్ల రిజర్వ్డ్ స్థానాలను 10 ఏళ్లు (2010 వరకు) పొడిగించారు."],

[86,2002,1,"Made free and compulsory education for children aged 6 to 14 a Fundamental Right (Article 21A), and a duty of parents.","6 నుండి 14 ఏళ్ల పిల్లలకు ఉచిత, నిర్బంధ విద్యను ప్రాథమిక హక్కుగా (ఆర్టికల్ 21A), తల్లిదండ్రుల విధిగా చేశారు."],
[87,2003,0,"Allowed constituency boundaries to be redrawn using the 2001 Census, without changing the number of seats.","స్థానాల సంఖ్య మార్చకుండా 2001 జనాభా లెక్కల ఆధారంగా నియోజకవర్గాల సరిహద్దులు మార్చేందుకు అనుమతి."],

[91,2003,1,"Limited the number of ministers to 15% of the House and made the anti-defection law stricter.","మంత్రుల సంఖ్యను సభలో 15%కి పరిమితం చేశారు; ఫిరాయింపుల నిరోధక చట్టాన్ని కఠినతరం చేశారు."],

[95,2009,0,"Extended reserved seats for SCs, STs and Anglo-Indians by 10 years, to 2020.","SC, ST, ఆంగ్లో-ఇండియన్ల రిజర్వ్డ్ స్థానాలను 10 ఏళ్లు (2020 వరకు) పొడిగించారు."],

[97,2011,0,"Gave constitutional status and protection to co-operative societies.","సహకార సంఘాలకు రాజ్యాంగ హోదా, రక్షణ ఇచ్చారు."],
[98,2012,0,"Special provisions for the Hyderabad–Karnataka region (Article 371J).","హైదరాబాద్–కర్ణాటక ప్రాంతానికి ప్రత్యేక నిబంధనలు (ఆర్టికల్ 371J)."],

[101,2016,1,"Introduced the Goods and Services Tax (GST), one tax across India, and created the GST Council of the Centre and the states.","దేశమంతటా ఒకే పన్నుగా వస్తు సేవల పన్ను (GST) తెచ్చారు; కేంద్రం, రాష్ట్రాలతో GST కౌన్సిల్ ఏర్పాటు."],
[102,2018,0,"Gave constitutional status to the National Commission for Backward Classes.","జాతీయ వెనుకబడిన తరగతుల కమిషన్‌కు రాజ్యాంగ హోదా ఇచ్చారు."],
[103,2019,1,"Allowed up to 10% reservation in education and government jobs for economically weaker sections not covered by other reservations.","ఇతర రిజర్వేషన్లు లేని ఆర్థికంగా బలహీన వర్గాలకు విద్య, ప్రభుత్వ ఉద్యోగాల్లో 10% వరకు రిజర్వేషన్‌కు అనుమతి."],
[104,2019,0,"Extended SC/ST reserved seats in Parliament and the assemblies by 10 years, to 2030, and ended nominated Anglo-Indian seats.","పార్లమెంటు, శాసనసభల్లో SC/ST రిజర్వ్డ్ స్థానాలను 10 ఏళ్లు (2030 వరకు) పొడిగించారు; ఆంగ్లో-ఇండియన్ నామినేటెడ్ స్థానాలను రద్దు చేశారు."],

// ---------- Automatic source check (Google News through the register script) ----------
const SECTOR_Q={water:["drinking water","తాగునీరు"],sanitation:["drainage garbage sanitation","మురుగు చెత్త పారిశుధ్యం"],health:["hospital","ఆసుపత్రి"],nutrition:["anganwadi","అంగన్‌వాడీ"],education:["school","పాఠశాల"],child:["child","చిన్నారి"],women:["women","మహిళ"],elderly:["pension","పింఛన్"],livelihood:["wages","ఉపాధి"],housing:["houses","ఇళ్లు"],roads:["road","రోడ్డు"],power:["power supply","విద్యుత్"],social:["dalit","దళిత"],agri:["farmers","రైతులు"]};
const KW_STOP=new Set("the and for with from that this have has had are was were been our their they them there here into over under about after before since without within village villages people families family mandal district months month weeks week days more than very also only still near since some many every each other another because".split(" "));
const hasTe=x=>/[ఀ-౿]/.test(x);
function keyWords(text,n,sector){const k=[];String(text||"").toLowerCase().replace(/[^a-z0-9ఀ-౿\s]/g," ").split(/\s+/).forEach(w=>{if(w.length>3&&!KW_STOP.has(w)&&!/^\d+$/.test(w)&&!k.includes(w))k.push(w)});
 const skw=sector&&S[sector]?S[sector].kw:[];return [...k.filter(w=>skw.some(s=>w.startsWith(s)||s.startsWith(w))),...k].filter((w,i,a)=>a.indexOf(w)===i).slice(0,n)}
const teName=en=>{const d=DISTRICTS.find(x=>x[0]===en);return d?d[1]:en};
async function fetchNews(q,lang){const u=REGISTER_URL+"?action=news&lang="+lang+"&q="+encodeURIComponent(q);const res=await fetch(u,{method:"GET"});const j=await res.json();if(!j||!j.ok)throw 0;return j.items||[]}
function scoreNews(items,tokens,needOne){const seen=new Set(),cut=Date.now()-430*864e5;
 return items.map(it=>{const h=(it.title||"").toLowerCase();const sc=tokens.filter(x=>x&&h.includes(x)).length;const hasNeed=!needOne||needOne.some(x=>x&&h.includes(x));const d=Date.parse(it.date||"");return {...it,score:sc+(it.trusted?.5:0),ok:hasNeed&&sc>=(needOne?2:1),old:d&&d<cut}})
  .filter(it=>it.ok&&!it.old&&it.title&&!seen.has(it.title.toLowerCase().replace(/\W+/g,""))&&seen.add(it.title.toLowerCase().replace(/\W+/g,"")))
  .sort((a,b)=>b.score-a.score||(Date.parse(b.date||0)||0)-(Date.parse(a.date||0)||0)).slice(0,8)}
// Duplicate = an earlier report in THIS app with the same mandal, same village/ward and same category (news is never used for this).
const sameVillage=(a,b)=>{const x=normName(a),y=normName(b);if(!x||!y)return false;return x===y||(Math.min(x.length,y.length)>=4&&(x.includes(y)||y.includes(x)))};
function similarIssues(r){const m=r.mandal||mandalIn(r.district,r.place);if(!m||!r.place)return [];
 return allData().filter(x=>x.district===r.district&&x.sector===r.sector&&normName(x.mandal||mandalIn(x.district,x.place))===normName(m)&&sameVillage(String(x.place||"").replace(new RegExp(m,"i"),""),r.place))
  .sort((a,b)=>String(b.created).localeCompare(String(a.created))).slice(0,4)}
let autoSrc=null,autoSeq=0;
const srcKey=r=>[ST,r.district,r.mandal,r.place,r.desc,r.sector].join("|");
async function runAutoSources(r){
 const seq=++autoSeq,key=srcKey(r);autoSrc={key,state:"checking",news:[],similar:[],confirmed:false};renderSrcBanner();
 const k=S[r.sector]?r.sector:"livelihood";const placeW=(r.place.match(/[A-Za-z]{4,}/)||[""])[0].toLowerCase();
 const kws=keyWords(r.desc,4,k);const teKw=kws.filter(hasTe),enKw=kws.filter(w=>!hasTe(w)&&!SECTOR_Q[k][0].includes(w));
 const qs=[["en",`"${r.district}" ${SECTOR_Q[k][0]}${enKw.length?" "+enKw.slice(0,2).join(" "):""}`],["te",`${teName(r.district)} ${SECTOR_Q[k][1]}${teKw.length?" "+teKw.slice(0,2).join(" "):""}`]];
 if(placeW)qs.push(["en",`${placeW} ${r.district}`]);
 const tokens=[r.district.toLowerCase(),teName(r.district),placeW,SECTOR_Q[k][0].split(" ")[0],SECTOR_Q[k][1],...kws,...S[k].kw];
 const need=[...r.district.toLowerCase().split(/[\s.–-]+/).filter(w=>w.length>3),teName(r.district),placeW].filter(Boolean);
 let items=[],failed=0;
 await Promise.all(qs.map(([lang,q])=>fetchNews(q,lang).then(x=>{items=items.concat(x)}).catch(()=>{failed++})));
 if(seq!==autoSeq)return;
 const similar=SHARED?similarIssues(r):[];
 if(failed===qs.length&&!similar.length){autoSrc={key,state:"fail",news:[],similar:[],confirmed:false};renderSrcBanner();return}
 const news=scoreNews(items,tokens,need);
 autoSrc={key,state:news.length||similar.length?"found":"none",news,similar,confirmed:false};
 renderSrcBanner();if(similar.length)openSrcPop("report");   // pop-up only for a real duplicate (same mandal + village + category); news stays in the banner
}
function renderSrcBanner(){const box=$("r-result");if(!box||!current||!autoSrc||autoSrc.key!==srcKey(current))return;let b=$("src-banner");
 if(!b){box.insertAdjacentHTML("afterbegin",'<div id="src-banner" class="autosrc" role="status"></div>');b=$("src-banner")}
 const st=autoSrc.state;b.className="autosrc"+(st==="found"?"":" none");
 if(st==="found"){const tr=autoSrc.news.filter(n=>safeLink(n)).length;b.innerHTML=`<p>${esc(t("srcFound").replace("{n}",autoSrc.news.filter(n=>safeLink(n)).length).replace("{m}",autoSrc.similar.length))}${autoSrc.confirmed?` · ${esc(t("srcConfirmed").replace("{n}",tr))}`:""}</p><button class="btn" type="button" id="src-open">${esc(t("srcView"))}</button>`;$("src-open").onclick=()=>openSrcPop("report")}
 else b.innerHTML=`<p>${esc(t(st==="checking"?"srcChecking":st==="fail"?"srcFail":"srcNone"))}</p>`;
}
let popSpeech="";
const TRUSTED_DOMAINS=["thehindu.com","newindianexpress.com","deccanchronicle.com","thehansindia.com","timesofindia.indiatimes.com","eenadu.net","sakshi.com","pib.gov.in","telanganatoday.com","andhrajyothy.com","thenewsminute.com","indianexpress.com","ndtv.com","etvbharat.com","hindustantimes.com","deccanherald.com"];
const hostOf=u=>{try{const x=new URL(u);return x.protocol==="https:"?x.hostname.toLowerCase().replace(/^www\./,""):""}catch(e){return ""}};
const onList=h=>!!h&&TRUSTED_DOMAINS.some(d=>h===d||h.endsWith("."+d));
// Opens only when the publisher is on the list AND the link itself is https to Google News or that publisher.
function safeLink(n){if(!n||!n.trusted||!onList(String(n.domain||"").toLowerCase().replace(/^www\./,"")))return "";const h=hostOf(n.link);return h&&(h==="news.google.com"||onList(h))?n.link:""}
function newsHTML(list){return [...list].sort((a,b)=>(safeLink(b)?1:0)-(safeLink(a)?1:0)).map(n=>{const href=safeLink(n);const date=n.date&&!isNaN(Date.parse(n.date))?`<span>${esc(new Date(n.date).toLocaleDateString(LANG==="te"?"te-IN":"en-IN"))}</span>`:"";
 return href?`<a class="nitem nlink" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><b class="nt">${esc(n.title)}</b><span class="nmeta"><span class="chip ok">${esc(n.source||"")} ✓</span>${date}<span>${esc(t("srcTrusted"))}</span></span><span class="readat">${esc(t("readAt").replace("{s}",n.source||t("srcSite")))}</span></a>`
  :`<div class="nitem nwarn" role="note"><b class="nt">${esc(n.title)}</b><span class="nmeta"><span class="chip crit">⚠ ${esc(n.domain||t("srcSite"))}</span>${date}</span><span class="warnline">⚠ ${esc(t("srcUnsafe"))}</span></div>`}).join("")}
function openSrcPop(mode,list){
 const d=$("src-pop"),body=$("src-pop-body"),foot=$("src-pop-foot");stopSpeak();

   `<p class="note">${esc(t("srcNote"))}</p>`;
  foot.innerHTML=(a.news.some(n=>safeLink(n))&&!a.confirmed?`<button class="btn" type="button" id="src-yes">${esc(t("srcConfirm"))}</button><button class="btn ghost" type="button" id="src-no">${esc(t("srcNotSame"))}</button>`:`<button class="btn" type="button" id="src-no">${esc(t("srcClose"))}</button>`);

 }else{$("src-pop-h").textContent=t("srcPopNews");
