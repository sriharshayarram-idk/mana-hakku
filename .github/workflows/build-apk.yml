name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check complaint-category detection
        run: node tools/test_detect.js && node tools/test_guide.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Private signing key (from GitHub Secrets, if set)
        env:
          MH_KEYSTORE_B64: ${{ secrets.MH_KEYSTORE_B64 }}
        run: |
          if [ -n "$MH_KEYSTORE_B64" ]; then echo "$MH_KEYSTORE_B64" | base64 -d > app/release.keystore; echo "Using the private release key"; else echo "No private key set: using the shared test key"; fi

      - name: Build APK
        env:
          MH_KEYSTORE_PASS: ${{ secrets.MH_KEYSTORE_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Remove the key file
        if: always()
        run: rm -f app/release.keystore

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "ManaHakku-v0.1.${{ github.run_number }}.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManaHakku-apk
          path: ManaHakku-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" "ManaHakku-v0.1.${{ github.run_number }}.apk" \
            --title "Mana Hakku v0.1.${{ github.run_number }}" \
            --notes "Android app (Telugu / English, read-aloud, voice input). Download the APK on your phone, open it, and allow installs from this source when Android asks."
