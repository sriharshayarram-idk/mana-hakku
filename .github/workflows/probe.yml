name: Probe
on:
  workflow_dispatch:
    inputs:
      titles: { description: "Wikipedia titles separated by |", required: true }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          IFS='|' read -ra T <<< "${{ github.event.inputs.titles }}"
          python3 tools/probe_wiki.py "${T[@]}" | tee out_log.txt || true
          mkdir -p out && mv out_log.txt out/
          cd out && git init -q -b probe && git add -A && git -c user.name=gha -c user.email=gha@users.noreply.github.com commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
