name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          cp app/src/main/assets/index.html site/index.html
          cp -r web/. site/
          node tools/export_keywords.js site/data/keywords.json
          cp -r app/src/main/assets/pdfjs site/pdfjs
          cp -r app/src/main/assets/docs site/docs
          cp -r app/src/main/assets/people site/people
          touch site/.nojekyll

      - name: Push site to gh-pages branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
