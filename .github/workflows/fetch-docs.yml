name: Fetch Constitution PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official PDFs and the PDF.js reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          sudo apt-get -qq install -y poppler-utils >/dev/null || true
          D=app/src/main/assets/docs; mkdir -p $D; R=$D/fetch-report.txt; : > $R
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          get(){ out=$1; shift; for u in "$@"; do code=$(curl -sSL --retry 2 -m 300 -A "$UA" -o "$out.tmp" -w "%{http_code}" "$u" 2>>$R); echo "$out <- $u : HTTP $code, $(stat -c%s "$out.tmp" 2>/dev/null) bytes, $(file -b "$out.tmp" | cut -c1-40)" >> $R; if [ "$code" = 200 ] && file -b "$out.tmp" | grep -q PDF; then mv "$out.tmp" "$out"; return 0; fi; done; rm -f "$out.tmp"; return 1; }
          get $D/constitution-en.pdf \
            "https://www.legislative.gov.in/static/uploads/2025/07/c9fe9c9b6840524844316f74bb1c556c.pdf" \
            "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf" \
            "https://eparlib.sansad.in/bitstream/123456789/2982247/1/29-05-27_Constitution_English_Final.pdf" || true
          get $D/constitution-te.pdf \
            "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2023/05/2023051268.pdf" || true
          for f in $D/*.pdf; do [ -f "$f" ] || continue; { echo "== $f"; pdfinfo "$f" | grep -E "Title|Pages|Producer|Creator|CreationDate|File size"; pdffonts "$f" | head -6; echo "-- text p1-4:"; pdftotext -f 1 -l 4 "$f" - | grep -v "^\s*$" | head -25; } >> $R 2>&1; done
          # PDF.js reader (legacy build works on older Android WebViews)
          TAG=$(gh api repos/mozilla/pdf.js/releases/latest --jq .tag_name); V=${TAG#v}
          echo "pdf.js $TAG" >> $R
          curl -sSL -o /tmp/pdfjs.zip "https://github.com/mozilla/pdf.js/releases/download/$TAG/pdfjs-$V-legacy-dist.zip" && rm -rf app/src/main/assets/pdfjs && mkdir -p app/src/main/assets/pdfjs && unzip -q /tmp/pdfjs.zip -d app/src/main/assets/pdfjs && du -sh app/src/main/assets/pdfjs >> $R && ls app/src/main/assets/pdfjs app/src/main/assets/pdfjs/web | head -30 >> $R
          # keep the reader small: no source maps, demo file, debugger, or locales other than English and Telugu
          P=app/src/main/assets/pdfjs
          find $P -name "*.map" -delete; rm -f $P/web/compressed.tracemonkey-pldi-09.pdf $P/web/debugger.*
          find $P/web/locale -mindepth 1 -maxdepth 1 -type d ! -name en-US ! -name te -exec rm -rf {} +
          du -sh $P $P/build $P/web >> $R; ls $P/build >> $R
          ls -la $D >> $R
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/assets/docs app/src/main/assets/pdfjs
          git commit -m "Add official Constitution PDFs and the PDF.js reader" || echo "nothing to commit"
          git push
