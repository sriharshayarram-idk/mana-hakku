name: RBI probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python tools/rbi_probe.py || true
      - name: Save report
        if: always()
        run: |
          mkdir out && cp probe.json out/ 2>/dev/null || echo '{}' > out/probe.json
          cd out && git init -q -b probe && git add -A && git -c user.name=gha -c user.email=gha@users.noreply.github.com commit -qm probe && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
