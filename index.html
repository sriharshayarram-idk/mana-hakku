<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>మన హక్కు · Mana Hakku has moved</title>

<meta http-equiv="refresh" content="3;url=https://manahakku-team.github.io/manahakku/">
<script>
// Sends every old link (page, section and #state/view) to the same place on the new address.
// This browser's own saved data on the old address (report keys, filings, owner code) goes along after "#",
// which never reaches any server, so reports saved here can still be marked as filed on the new address.
(function(){var p=location.pathname.replace(/^\/mana-hakku/i,"")||"/",h=location.hash||"",d={},n=0;
try{["mh-keys","mh-filing","mh-owner","mh-lang","mh-state"].forEach(function(k){var v=localStorage.getItem(k);if(v&&v!=="{}"){d[k]=v;n++}});var r=localStorage.getItem("mh-reports-v1");if(r&&r!=="[]"&&r.length<20000){d["mh-reports-v1"]=r;n++}}catch(e){n=0}
if(n){try{var b=btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");h="#mhimport="+b+"|"+h.replace(/^#/,"")}catch(e){}}
location.replace("https://manahakku-team.github.io/manahakku"+p+location.search+h)})();
</script>
